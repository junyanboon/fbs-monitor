<style>
  /* FBS Mobile — agenda-first sister app of the FBS Monitor board.
     Pattern: Jobber "Today's appointments" (filter chips) + Outlook agenda
     (chronological list, sticky now) + the Monitor's own palette. */
  :root{
    --ink:#f5f4f0; --scrim:#fbfaf7; --scrim-2:#edebe4; --line:#dedbd3;
    --chalk:#191715; --chalk-dim:#716c64; --chalk-faint:#a09a90;
    --tungsten:#5b2fd4; --tungsten-soft:rgba(91,47,212,.09);
    --ok:#2c7a4e; --watch:#b06c00; --crit:#c23a2b;
    --ok-bg:#e2efe7; --watch-bg:#f6ead6; --crit-bg:#f9e6e2;
    --sk-contract:#2f6fd0; --sk-aap:#17a673; --sk-oneoff:#f0b400; --sk-miss:#d93b30;
    --shadow:0 4px 14px rgba(25,23,21,.08);
    --sans:"Avenir Next",Avenir,Seravek,"Segoe UI",Ubuntu,sans-serif;
    --disp:"Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#161412; --scrim:#1e1b18; --scrim-2:#2a2622; --line:#403b34;
      --chalk:#f4f1ea; --chalk-dim:#beb7ab; --chalk-faint:#948d82;
      --tungsten:#b598f5; --tungsten-soft:rgba(181,152,245,.18);
      --ok:#82cda2; --watch:#eab365; --crit:#f08a7b;
      --ok-bg:#1d3527; --watch-bg:#3d2f12; --crit-bg:#46221c;
      --shadow:0 6px 18px rgba(0,0,0,.45);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--chalk);font-family:var(--sans);font-size:16px;line-height:1.45;
       -webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}

  /* header */
  header{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid var(--line);
         padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px}
  h1{font-family:var(--disp);font-weight:800;font-size:20px;margin:0;text-transform:uppercase;letter-spacing:.02em}
  h1 em{font-style:normal;color:var(--tungsten)}
  .hdate{font-size:12px;color:var(--chalk-dim)}
  .clock{margin-left:auto;text-align:right}
  .clock b{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
  /* Every time on this page is Toronto — the studios' clock — no matter where the
     phone is. Labelled so a Brazil/away timezone can never be mistaken for local. */
  .clock .tz{font-size:9.5px;letter-spacing:.12em;font-weight:700;color:var(--chalk-faint);margin-left:5px}
  /* freshness stamp doubles as the refresh button (44px touch target) */
  .clock button{background:none;border:0;padding:6px 0 6px 12px;margin:-6px 0;cursor:pointer;
                display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);
                font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ok);font-weight:600}
  .clock button.stale{color:var(--crit)}
  .clock button svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;
                    stroke-linecap:round;stroke-linejoin:round}
  .clock button.busy svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* summary strip */
  .sum{display:flex;gap:14px;padding:10px 16px;font-size:13.5px;color:var(--chalk-dim);
       border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
  .sum b{color:var(--chalk)} .sum b.good{color:var(--ok)} .sum b.bad{color:var(--crit)}

  /* filter chips (Jobber pattern) */
  .filters{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .fchip{flex:none;border:1px solid var(--line);background:var(--scrim);color:var(--chalk-dim);
         border-radius:99px;padding:7px 15px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
  .fchip.on{background:var(--tungsten);border-color:var(--tungsten);color:#fff}
  .fchip .n{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.75}

  main{padding:0 16px}
  .grp{margin:14px 0 4px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
       color:var(--chalk-faint)}
  .nowmark{display:flex;align-items:center;gap:8px;margin:14px 0;color:var(--tungsten);
           font-family:var(--mono);font-size:12px;font-weight:700}
  .nowmark::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--tungsten)}
  .nowmark::after{content:"";flex:1;height:2px;background:var(--tungsten);opacity:.7;border-radius:2px}

  /* booking card */
  .card{--sk:var(--sk-oneoff);
        display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;align-items:center;
        background:var(--scrim);border:1px solid var(--line);border-radius:12px;
        padding:11px 14px 11px 0;margin:8px 0;box-shadow:var(--shadow);overflow:hidden}
  .card .bar{grid-row:1/span 3;width:6px;height:100%;background:var(--sk);border-radius:0}
  .card.plan-contract{--sk:var(--sk-contract)}
  .card.plan-aap{--sk:var(--sk-aap)}
  .card.plan-oneoff{--sk:var(--sk-oneoff)}
  .card.flagged{--sk:var(--sk-miss);border-color:var(--sk-miss)}
  /* Two studios, one renter: flag stays, colour drops to amber — the builder
     cannot tell which row is the ghost, so it must not assert a no-show. */
  .card.live{border-color:var(--ok)}
  .card.done{opacity:.55}
  .card .who{grid-column:2;display:flex;align-items:center;gap:7px;min-width:0}
  .card .who .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .who .chip{flex:0 0 auto}
  .card .meta{grid-column:2;font-family:var(--mono);font-size:13px;color:var(--chalk-dim);
              font-variant-numeric:tabular-nums}
  .card .meta .arr{color:var(--ok)} .card .meta .dep{color:var(--chalk-faint)}
  .card .meta .miss{color:var(--crit);font-family:var(--sans)}
  .card .meta .wrong{color:var(--watch);font-family:var(--sans)}
  .card .meta .lbl{font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.08em;
                   vertical-align:1.5px;margin-right:1px}
  /* Mini timeline (2026-08-25): the bordered track IS the booked window —
     identical length on every card; presence >16 min outside the window is an
     amber stub OUTSIDE the track, so the window never shrinks. */
  .card .tl{grid-column:2;margin-top:3px}
  .card .tl .strip{display:flex;align-items:stretch;height:6px;width:fit-content}
  .card .tl .track{position:relative;width:200px;border-radius:99px;background:var(--scrim-2);
                   border:1px solid var(--line)}
  .card .tl .fill{position:absolute;top:-1px;bottom:-1px;border-radius:99px;background:var(--ok)}
  .card .tl .fill.liveseg{background:linear-gradient(90deg,var(--ok),var(--ok) 70%,transparent)}
  .card .tl .over{background:var(--watch);border-radius:99px;width:20px}
  .card .tl .over.pre{margin-right:2px}
  .card .tl .over.post{margin-left:2px}
  .card .tl .ends{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);
                  font-size:11px;color:var(--chalk-faint);margin-top:2px;
                  font-variant-numeric:tabular-nums;max-width:222px}
  .card .tl .ends span{white-space:nowrap}
  .card .tl .ends .a{color:var(--ok)} .card .tl .ends .w{color:var(--watch)} .card .tl .ends .x{color:var(--crit)}
  .card .right{grid-column:3;grid-row:1/span 3;text-align:right;font-size:12.5px;color:var(--chalk-dim);
               display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .card .right .chip{flex:0 0 auto}
  .card .studio{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--chalk);letter-spacing:.03em}
  .card .cnt{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .card .cnt b{color:var(--ok)}
  .chip{font-size:10.5px;letter-spacing:.05em;padding:2px 8px;border-radius:99px;font-weight:700;
        text-transform:uppercase;display:inline-block}
  .chip.type{background:var(--tungsten-soft);color:var(--tungsten)}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.watch{background:var(--watch-bg);color:var(--watch)}
  .chip.crit{background:var(--crit-bg);color:var(--crit)}
  .chip.plain{background:var(--scrim-2);color:var(--chalk-dim)}
  .quiet{color:var(--chalk-faint);text-align:center;padding:40px 0;font-size:14.5px}

  /* alarms + shifts panels reuse card look */
  .row{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:12px;align-items:center;
       background:var(--scrim);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:8px 0}
  /* open (claimable) shift rows — amber + dashed so they can't be misread as
     someone's scheduled shift. Display only; claiming happens on the Notion
     Open Shifts board, not here. */
  .row.orow{border:1px dashed var(--watch);background:var(--watch-bg)}
  .row.orow .nm{color:var(--watch)}
  .grp.open{color:var(--watch)}
  /* the one aesthetic outbound button — deep link into Notion, where the
     actual work (claiming a shift, releasing a message) happens */
  .notionbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 4px;
             padding:13px;border-radius:12px;background:var(--tungsten);color:#fff;
             font-family:var(--sans);font-weight:700;font-size:13.5px;letter-spacing:.05em;
             text-transform:uppercase;text-decoration:none;box-shadow:var(--shadow)}
  .notionbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;
                 stroke-linecap:round;stroke-linejoin:round}
  /* message rows: two-line middle cell — internal titles run long */
  .row .nm.mrow{display:flex;flex-direction:column;gap:2px;white-space:normal}
  .row .nm.mrow .code{font-size:13.5px;line-height:1.35;overflow:hidden;display:-webkit-box;
                      -webkit-line-clamp:2;-webkit-box-orient:vertical}
  .row .nm.mrow .sub{font-size:11px;font-weight:400;color:var(--chalk-faint)}
  /* robots: departure-board rows grouped by next fire (redesign 2026-08-25) */
  .tcard{background:var(--scrim);border:1px solid var(--line);border-radius:12px;padding:4px 12px;
         margin:8px 0;box-shadow:var(--shadow)}
  .trow{display:flex;align-items:baseline;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font-size:14px}
  .trow:last-child{border-bottom:0}
  .trow .tt{font-family:var(--mono);font-size:12.5px;color:var(--chalk-dim);min-width:50px;flex:none;
            font-variant-numeric:tabular-nums}
  .trow .n{font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .in{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ok);flex:none}
  .trow.bad .n,.trow.bad .tt,.trow.bad .in{color:var(--crit);font-weight:700}
  .trow.warn .n,.trow.warn .tt,.trow.warn .in{color:var(--watch);font-weight:700}
  .tcard.attn{border-color:var(--crit)}
  .row .tm{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums}
  .row .nm{font-weight:600;font-size:14.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .nm .st{color:var(--chalk-faint);font-weight:400;margin-left:6px}
  .row .ev{display:flex;gap:5px;align-items:center;flex:none;white-space:nowrap}
  .alert{background:var(--crit-bg);border:1px solid var(--crit);border-radius:12px;padding:12px 14px;margin:10px 0;
         color:var(--crit);font-weight:700}

  /* bottom tab bar */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;
      background:var(--ink);border-top:1px solid var(--line);
      padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:0;color:var(--chalk-faint);font-family:var(--sans);
             font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
             padding:7px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;
                 stroke-linecap:round;stroke-linejoin:round}
  nav button.on{color:var(--tungsten)}
  nav a{flex:1;color:var(--chalk-faint);font-family:var(--sans);font-weight:600;font-size:10px;
        letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;
        align-items:center;gap:3px;padding:0;text-decoration:none}
  nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
</style>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const hm=t=>{const h=Math.floor(((t%24)+24)%24),m=Math.round((t-Math.floor(t))*60);
  return String(h).padStart(2,"0")+":"+String(m%60).padStart(2,"0");};
const dur=h=>{const m=Math.round(h*60);return m>=60?`${Math.floor(m/60)}h${m%60?` ${m%60}m`:""}`:`${m}m`;};
const parseHM=s=>{if(!s)return null;const[a,b]=s.split(":").map(Number);return a+b/60;};
const GRACE=0.25;
const shortWho=w=>{let s=String(w||"");const i=s.indexOf(" — ");if(i>0)s=s.slice(0,i);
  /* Parentheticals are machine notes, not names (Junyan, 2026-08-25). */
  s=s.replace(/\s*\([^)]*\)/g,"").replace(/\s*\([^)]*$/,"").replace(/\s{2,}/g," ").trim();return esc(s);};   // 2nd replace: names arrive truncated mid-paren
/* ALL times on this page are America/Toronto — the studios' clock — no matter
   what timezone the device is in (Junyan reads this from Brazil). Built from
   Intl parts rather than parsing toLocaleString(), which is engine-dependent. */
const TOR = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",
  hour:"2-digit",minute:"2-digit",hour12:false});
function torontoNow(){
  const p = Object.fromEntries(TOR.formatToParts(new Date()).map(x=>[x.type,x.value]));
  const h = (+p.hour)%24, m = +p.minute;
  return {t: h+m/60, hhmm: String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")};
}
/* No arrival source answered this build ⇒ `arrived` is null for EVERY booking
   because nothing was watching, not because nobody came. Flagging then invents
   a no-show per finished renter. Suppress, and say why in the summary. */
const FEED_DOWN = !!(DATA.armFeed && DATA.armFeed.down);

function stateOf(e,now){
  const arr=parseHM(e.arrived),dep=parseHM(e.departed);
  const flagged=!FEED_DOWN&&e.kind==="booking"&&!arr&&now>e.start+GRACE&&now<e.end+1;
  if(dep&&dep>=e.start)return{done:true,flagged:false};
  if(now>=e.end)return{done:true,flagged};
  if(now>=e.start)return{live:true,flagged};
  return{flagged:false};
}

const E=(DATA.events||[]).filter(e=>e.kind==="booking");

  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  for(const k of['today','alarms','staff','messages','robots'])document.getElementById('tab-'+k).hidden=k!==b.dataset.t;
});
document.getElementById('filters').addEventListener('click',ev=>{

  const c=ev.target.closest('.fchip');if(!c)return;SFILTER=c.dataset.f;render();

const FLAG_MIN=16/60;   // within 16 min of the window = plain green (Junyan)
function warnChips(e,st){
  let t="";
  // e.heard = the renter has texted us today; that IS the confirmation, so the
  // chip clears on it without waiting for the desk to flip GTG.
  if(e.tier&&e.tier!=="Viewing"&&!e.gtg&&!e.heard&&!st.done)t+=`<span class="chip ${st.live?"crit":"watch"}">No GTG</span>`;
  /* Open Access / PIN row names this renter today: code will not work.
     Shown even after the booking ends — tomorrow's lockout too. */
  if(e.access_gap)t+=`<span class="chip crit">Code ✗</span>`;
  if(st.flagged&&!e.dup_studios)t+=`<span class="chip crit">Missing</span>`;
  return t;
}
function tlHTML(e,st,n){
  // Cross-midnight: start/end run past 24; arrived/departed are wall-clock.
  const nrm=t=>t==null?null:(t<e.start-12?t+24:t);
  const arr=nrm(parseHM(e.arrived)),dep=nrm(parseHM(e.departed));
  const span=e.end-e.start;
  const early=arr!=null&&(e.start-arr)>FLAG_MIN;
  const late=dep!=null&&(dep-e.end)>FLAG_MIN;
  let fill="";
  if(arr!=null){
    const b=dep!=null?Math.min(dep,e.end):Math.min(n,e.end);
    const l=Math.min(100,Math.max(0,(Math.max(arr,e.start)-e.start)/span*100));
    const w=Math.max(0,Math.min(100,(b-e.start)/span*100)-l);
    const liveFill=st.live&&dep==null;
    if(w>0||liveFill)fill=`<div class="fill ${liveFill?"liveseg":""}" style="left:${l.toFixed(1)}%;width:${Math.max(w,2).toFixed(1)}%"></div>`;
  }
  let L,R;
  if(arr!=null){
    const em=Math.round((e.start-arr)*60);
    L=e.assumed?`<span class="w">${e.arrived} in · ${e.assumed==="bypass"?"door bypassed":"forgot to arm"}</span>`
      :early?`<span class="w">${e.arrived} in · ${em}m early</span>`:`<span class="a">${e.arrived} in</span>`;
  }else if(st.flagged&&!e.dup_studios)L=`<span class="x">no arrival</span>`;
  else L=`<span>${hm(e.start)}</span>`;
  if(dep!=null){
    const lm=Math.round((dep-e.end)*60);
    R=late?`<span class="w">${e.departed} out · ${lm}m late</span>`:`<span class="a">${e.departed} out</span>`;
  }else R=`<span>${hm(e.end)}</span>`;
  return `<div class="tl"><div class="strip">${early?'<div class="over pre"></div>':""}`+
         `<div class="track">${fill}</div>${late?'<div class="over post"></div>':""}</div>`+
         `<div class="ends">${L}${R}</div></div>`;
}

function render(){
  const now=torontoNow(),n=now.t;
  $('#clock').textContent=now.hhmm;
  $('#hdate').textContent=DATA.date;

  const live=E.filter(e=>e.start<=n&&n<e.end);
  const flags=E.filter(e=>stateOf(e,n).flagged);
  $('#sum').innerHTML=
    `<span><b class="${live.length?"good":""}">${live.length}</b> in studio</span>`+
    `<span><b>${E.length}</b> today</span>`+
    `<span><b>${E.filter(e=>e.tier).length}</b> monitored</span>`+
    (FEED_DOWN
      ? `<span class="bad"><b>⚠</b> arrival feed down</span>`
      : `<span><b class="${flags.length?"bad":"good"}">${flags.length}</b> flags</span>`);

  /* filter chips: All / Live / Upcoming / per-studio */
  const f=[["all","All"],["live","Live now"],["next","Upcoming"],...DATA.studios.map(s=>[s.id,s.name])];
  $('#filters').innerHTML=f.map(([k,l])=>`<button class="fchip ${FILTER===k?"on":""}" data-f="${k}">${l}</button>`).join("");

  let list=[...E].sort((a,b)=>a.start-b.start||a.end-b.end);
  if(FILTER==="live")list=list.filter(e=>e.start<=n&&n<e.end);
  else if(FILTER==="next")list=list.filter(e=>e.start>n);
  else if(FILTER!=="all")list=list.filter(e=>e.studio===FILTER);

  const card=e=>{
    const st=stateOf(e,n);
    const plan=`plan-${e.plan||"oneoff"}`;
    let meta=`${hm(e.start)}–${hm(e.end)}`;
    /* In the building but in the wrong room — a different job from a no-show
       (which lives on the timeline + Missing pill). */
    if(e.wrong_studio)meta+=` <span class="wrong">⚠ in ${e.wrong_studio.studio} at ${e.wrong_studio.at}</span>`;
    const typeChip=e.tier?`<span class="chip type">${e.tier}</span>`:"";
    return `<div class="card ${plan} ${st.live?"live":""} ${st.done?"done":""} ${st.flagged?"flagged":""}">
      <div class="bar"></div>
      <div class="who"><span class="nm">${shortWho(e.who)}</span>${typeChip}</div>
      <div class="meta">${meta}</div>
      ${tlHTML(e,st,n)}
      <div class="right"><span class="studio">${esc(e.studio)}</span>${warnChips(e,st)}</div>
    </div>`;
  };

  /* chronological agenda with a NOW divider (Outlook pattern) */
  let html="",nowPlaced=false;
  const done=list.filter(e=>stateOf(e,n).done),
        rest=list.filter(e=>!stateOf(e,n).done);
  if(done.length){html+=`<div class="grp">Earlier</div>`+done.map(card).join("");}
  for(const e of rest){
    if(!nowPlaced&&e.start>n){html+=`<div class="nowmark">${now.hhmm}</div>`;nowPlaced=true;}
    html+=card(e);
  }
  if(!nowPlaced&&rest.length)html+=`<div class="nowmark">${now.hhmm}</div>`;
  $('#agenda').innerHTML=html||`<div class="quiet">Nothing on the schedule.</div>`;

  /* alarms — panel status first: one card per studio (armed/open, triggered
     alarms to clear, bypasses seen today), then the raw event stream. */
  const evsA=DATA.armEvents||[], alertsA=DATA.alarmAlerts||[];
  const tkey=t=>{if(!t)return 99;const[h,m]=t.split(":").map(Number);const v=h+m/60;return v<5?v+24:v;};
  const ord=(a,b)=>(tkey(a.time)-tkey(b.time))||((a.ts||0)-(b.ts||0));
  const grid=DATA.studios.map(s=>{
    const mine=evsA.filter(e=>e.studio===s.id).slice().sort(ord);
    const last=mine[mine.length-1];
    // An alarm is only outstanding if nobody touched the panel at/after it —
    // a disarm after the trigger means someone was there and cleared it.
    const cleared=a=>mine.some(e=>tkey(e.time)>=tkey(a.time));
    const trig=alertsA.filter(a=>a.studio===s.id&&!["BYPASS","TROUBLE"].includes(a.stage)&&!cleared(a));
    const byp=alertsA.filter(a=>a.studio===s.id&&a.stage==="BYPASS"&&!cleared(a));
    const trb=alertsA.filter(a=>a.studio===s.id&&a.stage==="TROUBLE");   // trouble clears only when ADT says so
    const real=trig.some(a=>a.stage==="ALARM");
    // Nothing today? The panel didn't reset at 05:00 — carry the durable
    // last-known event forward rather than claiming we know nothing.
    const eff=last||(DATA.panelPrior||{})[s.id];
    // Panel status shows STATE + anything that needs a person. No trailing prose.
    const isOpen=eff&&eff.kind==="arrival";
    const stTxt=eff?(isOpen?"🔓 Open":"🔒 Armed"):"Unknown";
    let act="";
    if(trig.length)act+=`<span class="chip crit">${real?"⚠ Clear alarm":"Alarm pending"}</span>`;
    // Panel errors ride on the state line beside the lock, not in the trailing
    // chip run — the right-hand run is where routine state lives, and a fault
    // read as just another chip there is a fault nobody acts on. Bypass is
    // real but routine, so it takes amber and yields to a real trouble.
    const err=trb.length?{t:esc(trb[trb.length-1].detail||"Panel trouble"),w:false}
             :byp.length?{t:"Bypass",w:true}:null;
    if(trb.length&&byp.length)act+=`<span class="chip watch">Bypass</span>`;
    if(trb.length>1)act+=`<span class="chip crit">+${trb.length-1}</span>`;
    if(isOpen&&!trig.length){
      const occ=(DATA.events||[]).some(e=>e.studio===s.id&&e.start-0.5<=n&&n<e.end+0.5);
      if(!occ)act+=`<span class="chip crit">⚠ No booking</span>`;
    }
    return `<div class="row" style="${(trig.length||trb.length)?"border-color:var(--crit)":""}">
      <span class="tm" style="font-family:var(--disp);font-weight:800;font-size:17px">${esc(s.name)}</span>
      <span class="nm">${stTxt}${err?`<span class="chip ${err.w?"watch":"crit"}" style="margin-left:6px;font-family:var(--sans);font-size:10px;vertical-align:middle">⚠ ${err.t}</span>`:""}</span>
      <span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">${act}</span>
    </div>`;
  }).join("");

  /* stream = arm/disarm events + triggers/bypasses interleaved, newest first.
     The studio is its own chip so a long name can never truncate it away. */
  const stream=[
    ...evsA.map(a=>({...a,html:`<div class="row">
      <span class="tm">${a.time}</span>
      <span class="nm">${esc(a.name||"—")}</span>
      <span class="ev"><span class="chip plain">${esc(a.studio)}</span><span class="chip ${a.kind==="arrival"?"ok":"plain"}">${a.kind==="arrival"?"↓ Disarmed":"↑ Armed"}</span></span>
    </div>`})),
    ...alertsA.map(a=>{
      // cleared = someone touched that studio's panel at/after the alert.
      // Trouble conditions are the exception: a disarm does not repair a tamper,
      // a dead battery or a panel that can't reach the monitoring centre, and
      // the card above already refuses to clear them. Marking them "Cleared"
      // here said the opposite of the card on the same screen.
      const done=a.stage!=="TROUBLE"&&
        evsA.some(e=>e.studio===a.studio&&tkey(e.time)>=tkey(a.time));
      const label=a.stage==="BYPASS"?"Sensor bypass":a.stage==="TROUBLE"?(a.detail||"Panel trouble")
                 :a.stage==="ALARM"?"Alarm triggered":"Alarm pending";
      return {...a,html:`<div class="row" style="${done?"opacity:.6":"border-color:var(--crit);background:var(--crit-bg)"}">
      <span class="tm">${a.time}</span>
      <span class="nm" style="${done?"":"color:var(--crit)"}">${label}</span>
      <span class="ev"><span class="chip plain">${esc(a.studio)}</span><span class="chip ${done?"plain":"crit"}">${done?"Cleared":"⚠ Action"}</span></span>
    </div>`};}),
  ].sort((a,b)=>ord(b,a)).map(x=>x.html).join("");
  $('#alarms').innerHTML=`<div class="grp">Panel status</div>`+grid+
    `<div class="grp">Today's events</div>`+(stream||`<div class="quiet">No alarm events yet today.</div>`);

  /* shifts: open (claimable) placeholders pinned on top, then today's roster.
     Chips mirror the Today-tab filter pattern: All / Open / one per person. */
  const OPEN=DATA.openShifts||[];
  const names=[...new Set((DATA.staff||[]).map(s=>s.name))];
  const sf=[["all","All"],["open",`Open <span class="n">${OPEN.length}</span>`],...names.map(x=>[x,esc(x)])];
  $('#sfilters').innerHTML=sf.map(([k,l])=>`<button class="fchip ${SFILTER===k?"on":""}" data-f="${esc(k)}">${l}</button>`).join("");
  const showOpen=SFILTER==="all"||SFILTER==="open";
  const openRows=showOpen?OPEN.map(o=>`<div class="row orow">
      <span class="tm">${hm(o.start)}</span>
      <span class="nm">${esc(o.role)}${o.studio?`<span class="st">${esc(o.studio)}</span>`:""}</span>
      <span class="ev"><span class="chip watch">${esc(o.day)} · ${hm(o.start)}–${hm(o.end)}</span></span>
    </div>`).join(""):"";
  const roster=SFILTER==="open"?[]:(DATA.staff||[]).filter(s=>SFILTER==="all"||s.name===SFILTER);
  const st=roster.map(s=>{
    const on=s.start<=n&&n<s.end,past=n>=s.end;
    return `<div class="row" style="${past?"opacity:.55":""}">
      <span class="tm">${hm(s.start)}</span>
      <span class="nm">${esc(s.name)}<span class="st">${esc(s.role||"")}</span></span>
      <span class="chip ${on?"ok":past?"plain":"watch"}">${on?"On now":past?"Done":hm(s.start)+"–"+hm(s.end)}</span>
    </div>`;
  }).join("");
  const claimBtn=`<a class="notionbtn" href="https://app.notion.com/p/3897503281c480f2ade3c6bc1f299c60?v=3897503281c480dc8131000c1bbf52e2" target="_blank" rel="noopener">Claim a shift in Notion<svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`;
  $('#staff').innerHTML=
    (openRows?`<div class="grp open">Unclaimed</div>`+openRows
             :SFILTER==="open"?`<div class="quiet">No open shifts right now.</div>`:"")+
    (showOpen?claimBtn:"")+
    (SFILTER!=="open"?`<div class="grp">Scheduled today</div>`+
      (st||`<div class="quiet">No staff shifts today.</div>`):"");

  /* messages: queue rows awaiting a human — titles only, bodies stay in
     Notion. The button is the tab's whole point: process them there. */
  const MSGS=DATA.messages||[];
  const mstat=s=>s==="Error"?["crit","Error"]:s==="Ready to Send"?["ok","Sending"]:["watch","Review"];
  const mrows=MSGS.map(m=>{const [mc,ml]=mstat(m.status);
    return `<div class="row">
      <span class="ev"><span class="chip plain">${esc(m.channel||"?")}</span></span>
      <span class="nm mrow"><span class="code">${esc(m.code)}</span>
        <span class="sub">${esc(m.raised_by||"")}${m.studio?` · ${esc(m.studio)}`:""}${m.created?` · ${esc(m.created)}`:""}</span></span>
      <span class="ev"><span class="chip ${mc}">${ml}</span></span>
    </div>`;}).join("");
  $('#messages').innerHTML=
    `<a class="notionbtn" href="https://app.notion.com/p/3887503281c48136a627cfc8749e6e57?v=3887503281c481ddb3c7000cf236c3e2" target="_blank" rel="noopener">Process in Notion<svg viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></svg></a>`+
    (mrows?`<div class="grp">Pending processing — ${MSGS.length}</div>`+mrows
          :`<div class="quiet">No messages waiting.</div>`);

  /* robots — projection of the Run Monitor DB (same data as the desktop tab) */
/* One-line job descriptions — the Notion "Produces" text is prose; this is the
   glanceable version. Fallback: first 40 chars of Produces. */
const ROBOT_DESC={"Concierge":"Inbox triage + alarm tracking","Weatherman":"Sets studio thermostats",
  "Analyst":"Today's itinerary report","Bookkeeper":"Logs staff hours","Custodian":"Data housekeeping",
  "Doorman":"Morning alarm preflight","Host":"Builds today's FBS board","Planner":"Stages tomorrow's prep",
  "Responder":"Drafts held replies","Sentinel":"Pages if a run goes missing","Timekeeper":"Overtime report",
  "Treasurer":"Monthly reconciliation","Watchman":"Watches the Sentinel"};
function robotDesc(r){
  const hit=Object.keys(ROBOT_DESC).find(k=>r.run.includes(k));
  return hit?ROBOT_DESC[hit]:(r.produces||"").slice(0,40);
}
/* Predict the next fire from the human "Expected" string. Handles the roster's
   actual shapes: "~05:30" / "07:00" (daily), "09:35 + 02:35" (2×/day),
   ":20 + :50 · 08:20–22:50" (hourly minutes in a window), "hourly :30 · 07–23",
   "every 2 h at :10 · 08:10–22:10", "1st of month, 08:00". Returns
   {hhmm, mins} or null when it cannot tell. */
function nextRun(r, nowT){
  const e=(r.expected||"").split("(")[0];
  if((r.cadence||"").toLowerCase()==="monthly"){
    const m=e.match(/(\d{1,2}):(\d{2})/);
    return m?{hhmm:`1st · ${m[0]}`,mins:null}:null;
  }
  const win=e.match(/(\d{1,2})(?::(\d{2}))?\s*[–-]\s*(\d{1,2})(?::(\d{2}))?/);
  const ws=win? +win[1]+(+win[2]||0)/60 : 0, we=win? +win[3]+(+win[4]||0)/60 : 24;
  const body=win? e.replace(win[0],"") : e;
  let cands=[];
  const every=e.match(/every\s+(\d+)\s*h(?:ours?)?\s*(?:at\s*)?:(\d{2})/i);
  const everyMin=e.match(/every\s+(\d+)\s*min/i);
  const hourly=e.match(/hourly(?:\s*:(\d{2}))?/i);
  const mins=[...body.matchAll(/(?:^|[^\d])(?::(\d{2}))\b/g)].map(m=>+m[1]).filter(v=>!isNaN(v));
  const daily=[...body.matchAll(/(\d{1,2}):(\d{2})/g)].map(m=>(+m[1])+(+m[2])/60);
  const addHourly=(step,minute)=>{for(let h=0;h<48;h++){const t=h+minute/60;
    const d=t%24; if(d>=ws-1e-9&&d<=we+1e-9&&(h-Math.floor(ws))%step===0)cands.push(t);}};
  if(everyMin){const step=+everyMin[1];
    for(let t=0;t<48;t+=step/60){const d=t%24;
      if(d>=ws-1e-9&&d<=we+1e-9)cands.push(t);}}
  else if(every)addHourly(+every[1],+every[2]);
  else if(mins.length&&!daily.length)mins.forEach(mm=>addHourly(1,mm));
  else if(hourly)addHourly(1,+(hourly[1]||0));
  else if(daily.length)daily.forEach(t=>{cands.push(t);cands.push(t+24);});
  else return null;
  cands.sort((a,b)=>a-b);
  const nxt=cands.find(t=>t>nowT+1/60);
  if(nxt==null)return null;
  const d=Math.round((nxt-nowT)*60);
  const hh=String(Math.floor(nxt%24)).padStart(2,"0"), mm=String(Math.round((nxt%1)*60)%60).padStart(2,"0");
  return {hhmm:`${hh}:${mm}`,mins:d};
}
function cdTxt(nr){
  if(!nr)return"";
  if(nr.mins==null)return nr.hhmm;
  const c=nr.mins<60?`in ${nr.mins}m`:`in ${Math.floor(nr.mins/60)}h ${nr.mins%60}m`;
  return `${nr.hhmm} · ${c}`;
}

  const R=DATA.robots;
  const ago=iso=>{if(!iso)return"never";const m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));
    return m<60?`${m}m ago`:m<1440?`${Math.floor(m/60)}h ago`:`${Math.floor(m/1440)}d ago`;};
  if(!R){$('#robots').innerHTML=`<div class="quiet">${esc(DATA.robotsNote||"Run Monitor could not be read this edition")}</div>`;}
  else{
    /* Departure board (redesign 2026-08-25, Junyan's pick): rows grouped by
       when each robot fires NEXT — attention first, then Next hour / Later
       today / Overnight / Tomorrow. One line per robot; descriptions and
       per-row status pills dropped deliberately. Live rows only —
       retired/paused personas are Run-Monitor bookkeeping, not operations. */
    const liveR=R.filter(r=>r.monitoring==="Live").map(r=>({...r,nr:nextRun(r,n)}));
    const attn=liveR.filter(r=>r.status!=="ok");
    const fine=liveR.filter(r=>r.status==="ok")
      .sort((a,b)=>((a.nr&&a.nr.mins)??1e9)-((b.nr&&b.nr.mins)??1e9));
    const buckets=[["Next hour",[]],["Later today",[]],["Overnight",[]],["Tomorrow",[]],["Later",[]]];
    for(const r of fine){
      if(!r.nr||r.nr.mins==null){buckets[4][1].push(r);continue;}
      const fire=n+r.nr.mins/60;
      if(r.nr.mins<=60)buckets[0][1].push(r);
      else if(fire<24)buckets[1][1].push(r);
      else if(fire%24<6)buckets[2][1].push(r);
      else buckets[3][1].push(r);
    }
    const trow=(r,cls)=>`<div class="trow ${cls||""}">
      <span class="tt">${esc(r.nr?r.nr.hhmm:"—")}</span>
      <span class="n">${esc(r.run)}</span>
      <span class="in">${cls?`${esc(r.statusLabel.toLowerCase())} · silent ${ago(r.lastISO).replace(" ago","")}`
                          :(r.nr&&r.nr.mins!=null&&r.nr.mins<=60?`in ${r.nr.mins}m`:"")}</span>
    </div>`;
    $('#robots').innerHTML=
      (attn.length?`<div class="grp" style="color:var(--crit)">Needs attention</div>
        <div class="tcard attn">${attn.map(r=>trow(r,r.status==="crit"?"bad":"warn")).join("")}</div>`:"")+
      buckets.filter(([,list])=>list.length).map(([label,list])=>
        `<div class="grp">${label}</div><div class="tcard">${list.map(r=>trow(r)).join("")}</div>`).join("")||
      `<div class="quiet">Nothing watched.</div>`;
  }

  /* Issues tab removed 2026-08-25 — access problems are a red pill on the
     booking card; everything else lives in Notion. */

  /* freshness */
  const gen=DATA.generatedAtISO?new Date(DATA.generatedAtISO):null;
  if(gen){const age=Math.round((Date.now()-gen.getTime())/60000);
    $('#freshtxt').textContent=`data ${age} min old`;
    $('#fresh').classList.toggle('stale',age>40);}
}
render();
setInterval(render,30000);

/* ── refresh: the page is a static edition. checkEdition probes version.json
   (~60 bytes, cache-busted) for a newer edition and reloads onto it. Polling that
   instead of refetching this 39 KB page is what lets the interval be 30 s while
   using ~13× less data than the old 5-minute page poll — on a phone abroad that
   difference is the whole point. Wired to the header stamp button,
   pull-to-refresh, the 30 s poll, and app-resume. */
/* Offline copy. The worker is network-first for this page and never caches
   version.json, so registering it cannot pin the app to an old edition — it only
   decides what you see when the network is gone. See sw.js. */
if('serviceWorker' in navigator)
  navigator.serviceWorker.register('sw.js').catch(()=>{});

let checking=false;
function checkEdition(manual){
  if(checking)return;checking=true;
  const btn=$('#fresh');btn.classList.add('busy');
  const base=location.pathname.replace(/[^/]*$/,'');
  fetch(base+"version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(v=>{
    const live=v.generatedAtISO;
    // GitHub Pages serves this file with max-age=600, so a plain reload can be
    // answered from cache with the OLD edition. Reload onto a unique URL instead.
    if(live&&DATA.generatedAtISO&&live!==DATA.generatedAtISO){
      location.replace(location.pathname+"?e="+encodeURIComponent(live));return;}
    if(manual){const s=$('#freshtxt'),old=s.textContent;s.textContent="up to date";
      setTimeout(()=>{s.textContent=old;},1600);}
  }).catch(()=>{}).finally(()=>{checking=false;btn.classList.remove('busy');render();});
}
$('#fresh').addEventListener('click',()=>checkEdition(true));
setInterval(()=>checkEdition(false),30000);
/* re-check when the installed app comes back to the foreground */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkEdition(false);});
/* pull-to-refresh (standalone PWAs have no browser reload control) */
let pullY=null;
document.addEventListener('touchstart',e=>{if(window.scrollY===0)pullY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchmove',e=>{
  if(pullY!==null&&e.touches[0].clientY-pullY>90){pullY=null;checkEdition(true);}
},{passive:true});
document.addEventListener('touchend',()=>{pullY=null;},{passive:true});
</script>

</body>
</html>

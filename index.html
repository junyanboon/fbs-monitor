<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<title>FBS Studio Monitor — Dance Annex</title>
<!-- Same "pulse tile" icon as site/favicon.svg, inlined so the artifact copy is self-contained -->
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="7" fill="%232c7a4e"/><polyline points="5,16 11,16 14,9 18,23 21,16 27,16" fill="none" stroke="%23f4f2ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<!-- Web-app install (PWA): manifest + iOS standalone metas. Relative paths resolve
     under /fbs-monitor/ on Pages; harmless in other contexts. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2c7a4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FBS Monitor">
<style>
  /* Palette: Day Sheet system (junyanboon.github.io/day-sheet) — paper ground,
     purple brand, act/wait/hot/done semantics. Light-first, like the Day Sheet.
     Layout: "Design C — studio strips" (approved 2026-07-19): one strip per studio,
     occupancy stamped at the left edge, tier as a colored card edge. */
  :root{
    --ink:#f5f4f0; --scrim:#fbfaf7; --scrim-2:#edebe4; --line:#dedbd3;
    --chalk:#191715; --chalk-dim:#716c64; --chalk-faint:#a09a90;
    --tungsten:#5b2fd4; --tungsten-soft:rgba(91,47,212,.09);
    --ok:#2c7a4e; --watch:#b06c00; --crit:#c23a2b;
    --ok-bg:#e2efe7; --watch-bg:#f6ead6; --crit-bg:#f9e6e2;
    --live-bg:#eef3ec; --live-line:#bcd4c2;
    --shadow:0 6px 18px rgba(25,23,21,.07);
    --disp:"Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;
    --sans:"Avenir Next",Avenir,Seravek,"Segoe UI",Ubuntu,sans-serif;
    --body:Seravek,"Avenir Next","Segoe UI",Ubuntu,sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#161412; --scrim:#1e1b18; --scrim-2:#2a2622; --line:#403b34;
      --chalk:#f4f1ea; --chalk-dim:#beb7ab; --chalk-faint:#948d82;
      --tungsten:#b598f5; --tungsten-soft:rgba(181,152,245,.18);
      --ok:#82cda2; --watch:#eab365; --crit:#f08a7b;
      --ok-bg:#1d3527; --watch-bg:#3d2f12; --crit-bg:#46221c;
      --live-bg:#20312a; --live-line:#41604e;
      --shadow:0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --ink:#f5f4f0; --scrim:#fbfaf7; --scrim-2:#edebe4; --line:#dedbd3;
    --chalk:#191715; --chalk-dim:#716c64; --chalk-faint:#a09a90;
    --tungsten:#5b2fd4; --tungsten-soft:rgba(91,47,212,.09);
    --ok:#2c7a4e; --watch:#b06c00; --crit:#c23a2b;
    --ok-bg:#e2efe7; --watch-bg:#f6ead6; --crit-bg:#f9e6e2;
    --live-bg:#eef3ec; --live-line:#bcd4c2;
    --shadow:0 6px 18px rgba(25,23,21,.07);
  }
  :root[data-theme="dark"]{
    --ink:#161412; --scrim:#1e1b18; --scrim-2:#2a2622; --line:#403b34;
    --chalk:#f4f1ea; --chalk-dim:#beb7ab; --chalk-faint:#948d82;
    --tungsten:#b598f5; --tungsten-soft:rgba(181,152,245,.18);
    --ok:#82cda2; --watch:#eab365; --crit:#f08a7b;
    --ok-bg:#1d3527; --watch-bg:#3d2f12; --crit-bg:#46221c;
    --live-bg:#20312a; --live-line:#41604e;
    --shadow:0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--chalk);font-family:var(--body);font-size:16.5px;line-height:1.5;
       -webkit-font-smoothing:antialiased;padding:0 0 64px}

  /* ── slim header: title · summary · clock+freshness ── */
  header{position:sticky;top:0;z-index:30;background:var(--ink);border-bottom:1px solid var(--line);
         padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .brand{font-family:var(--sans);font-weight:600;letter-spacing:.24em;text-transform:uppercase;
         font-size:10px;color:var(--chalk-dim)}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(19px,2.6vw,26px);margin:0;letter-spacing:.02em;
     text-transform:uppercase;line-height:1}
  h1 em{font-style:normal;color:var(--tungsten)}
  h1 small{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.05em;color:var(--chalk-dim);
           text-transform:none;margin-left:10px}
  .summary{font-size:14.5px;color:var(--chalk-dim);margin-left:auto;font-variant-numeric:tabular-nums}
  .summary b{color:var(--chalk);font-weight:700}
  .summary b.good{color:var(--ok)} .summary b.warn{color:var(--watch)} .summary b.bad{color:var(--crit)}
  .summary .sep{margin:0 7px;color:var(--chalk-faint)}
  .clockwrap{display:flex;flex-direction:column;align-items:flex-end;gap:1px;
             padding-left:18px;border-left:1px solid var(--line)}
  .clock{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;
         color:var(--chalk);display:flex;align-items:center;gap:8px;line-height:1.1}
  .clock small{font-family:var(--body);font-size:10.5px;font-weight:400;color:var(--chalk-dim);
               letter-spacing:.08em;text-transform:uppercase}
  .clock .dot{width:8px;height:8px;border-radius:50%;background:var(--tungsten);
              animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--tungsten-soft)}50%{opacity:.55;box-shadow:0 0 0 7px transparent}}
  .datastamp{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;cursor:pointer;
             font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
             color:var(--ok);transition:color .15s ease}
  .datastamp:hover,.datastamp:focus-visible{color:var(--tungsten);outline:none}
  .datastamp svg{width:12px;height:12px;flex:none}
  .datastamp.busy svg{animation:spin .8s linear infinite}
  .datastamp.stale{color:var(--crit)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .clock .dot{animation:none} .nowline::after{animation:none} }

  main{max-width:1140px;margin:0 auto;padding:0 24px}

  /* ── tabs ── */
  .tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line)}
  .tabs .tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;
             font-family:var(--sans);font-weight:700;font-size:13.5px;letter-spacing:.08em;
             text-transform:uppercase;color:var(--chalk-dim)}
  .tabs .tab.on{color:var(--chalk);border-bottom-color:var(--tungsten)}
  .tabs .tab:hover{color:var(--chalk)}
  .tabs .tab:focus-visible{outline:2px solid var(--tungsten);outline-offset:-2px}

  /* status bar (Studios tab) — status.claude.com-style: one overall state, plus
     any items from the analyst report. Grade-3 wording, colour = severity. */
  /* Spacing uses margins, not flex `gap`: older iOS Safari (the home-screen web app)
     ignores gap, which collapsed the dot onto the text. Margins work everywhere. */
  .statusbar{margin-top:16px;padding:12px 16px;border-radius:10px;border:1px solid var(--line);
             background:var(--scrim);display:flex;flex-wrap:wrap;align-items:center}
  .statusbar .dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block;
                  margin-right:10px}
  .statusbar .head{font-weight:800;font-size:15.5px;white-space:nowrap;margin-right:12px}
  .statusbar.ok{background:var(--ok-bg);border-color:transparent}
  .statusbar.ok .dot{background:var(--ok)}  .statusbar.ok .head{color:var(--ok)}
  .statusbar.warn{background:var(--watch-bg);border-color:transparent}
  .statusbar.warn .dot{background:var(--watch)} .statusbar.warn .head{color:var(--watch)}
  .statusbar.crit{background:var(--crit-bg);border-color:transparent}
  .statusbar.crit .dot{background:var(--crit)} .statusbar.crit .head{color:var(--crit)}
  .statusbar .items{display:flex;flex-wrap:wrap}
  .statusitem{display:inline-flex;align-items:center;background:var(--scrim);
              border:1px solid var(--line);border-radius:99px;padding:4px 12px;
              font-weight:700;font-size:14px;color:var(--chalk);margin:3px 8px 3px 0}
  .statusitem .sdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;
                    margin-right:7px}
  .statusitem .sdot.info{background:var(--tungsten)}
  .statusitem .sdot.warn{background:var(--watch)}
  .statusitem .sdot.crit{background:var(--crit)}

  /* staff tab panels */
  .panelwrap{background:var(--scrim);border:1px solid var(--line);border-radius:12px;overflow:hidden;
             box-shadow:var(--shadow)}
  .shift{display:grid;grid-template-columns:132px 1fr auto auto;gap:12px;padding:11px 16px;
         border-bottom:1px solid var(--line);align-items:center}
  .shift:last-child{border-bottom:none}
  .shift.live{background:var(--live-bg);box-shadow:inset 4px 0 0 var(--ok)}
  .shift.done{opacity:.65}
  .shift .tm{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .shift .nm{font-weight:600;font-size:15.5px;min-width:0}

  .lane-label{font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;
              color:var(--chalk-dim);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
  .lane-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .lane-label .crit-note{color:var(--crit);letter-spacing:.06em}

  /* ── studio strips ── */
  .strips{background:var(--scrim);border:1px solid var(--line);border-radius:12px;overflow:hidden;
          box-shadow:var(--shadow);margin-top:18px}
  .strip{display:grid;grid-template-columns:104px 1fr;border-bottom:1px solid var(--line)}
  .strip:last-child{border-bottom:none}
  .stu{padding:14px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;
       justify-content:center;gap:4px}
  .stu .id{font-family:var(--disp);font-weight:800;font-size:29px;letter-spacing:.02em;line-height:1}
  .stu .occ{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .stu .occ.live{color:var(--ok)} .stu .occ.empty{color:var(--chalk-faint);font-weight:600}
  .lane{padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .lane .quiet{font-size:14px;color:var(--chalk-faint);padding:4px 2px}
  .ev{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:12px;align-items:center;
      padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--ink)}
  .ev.live{background:var(--live-bg);border-color:var(--live-line);box-shadow:inset 4px 0 0 var(--ok)}
  .ev.flagged{background:var(--crit-bg);border-color:var(--crit);box-shadow:inset 4px 0 0 var(--crit)}
  .ev.done{opacity:.68}
  .ev.tier-t{border-left:4px solid var(--tungsten)}
  .ev.live.tier-t,.ev.flagged.tier-t{border-left-width:1px}  /* live/flag edge wins */
  .ev.cleaning{background:repeating-linear-gradient(-45deg,var(--scrim-2) 0 7px,var(--scrim) 7px 14px)}
  .ev .tm{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;line-height:1.4}
  .ev .tm .act{display:block;font-size:12.5px;color:var(--ok)}
  .ev .tm .act.dep{color:var(--chalk-dim)}
  .ev .tm .act.miss{color:var(--crit);font-family:var(--body);letter-spacing:.02em}
  .ev .who{font-size:16px;font-weight:600;min-width:0}
  .ev .who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;
               max-width:100%;vertical-align:bottom}
  .ev .tags{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle;flex-wrap:wrap}
  .ev .cnt{font-family:var(--mono);font-size:14px;color:var(--chalk-dim);text-align:right;white-space:nowrap;
           font-variant-numeric:tabular-nums}
  .ev .cnt b{color:var(--ok);font-weight:700}
  .chip{font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;padding:2px 8px;border-radius:99px;font-weight:600;
        text-transform:uppercase;display:inline-block}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.watch{background:var(--watch-bg);color:var(--watch)}
  .chip.crit{background:var(--crit-bg);color:var(--crit)}
  .chip.type{background:var(--tungsten);color:#fff}
  .chip.mon{background:var(--ok);color:#fff}
  .chip.plain{background:var(--scrim-2);border:1px solid var(--line);color:var(--chalk-dim)}
  .chip.cov-ok{background:var(--ok-bg);color:var(--ok)}
  .chip.cov-part{background:var(--watch-bg);color:var(--watch)}
  .chip.cov-no{background:var(--crit-bg);color:var(--crit)}
  .chip.cov-ai{background:var(--tungsten-soft);color:var(--tungsten)}
  @media (max-width:640px){
    .strip{grid-template-columns:72px 1fr}
    .ev{grid-template-columns:88px minmax(0,1fr)}
    .ev .cnt{grid-column:2;text-align:left}
    .summary{width:100%;order:5;margin-left:0}
  }

  /* ── board (timeline, unchanged mechanics) ── */
  .boardwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--scrim)}
  .board{display:grid;min-width:980px;position:relative}
  .studio-h{position:sticky;top:0;background:var(--scrim-2);border-bottom:1px solid var(--line);
            padding:12px 14px;z-index:5;text-align:center}
  .studio-h h2{margin:0;font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
  .studio-h .sub{font-size:11.5px;color:var(--chalk-dim);letter-spacing:.07em;text-transform:uppercase}
  .timecol{border-right:1px solid var(--line)}
  .timecol .cell, .col .slot{height:52px}
  .timecol .cell{font-family:var(--mono);font-size:11px;color:var(--chalk-faint);text-align:right;
                 padding:2px 8px 0 0;font-variant-numeric:tabular-nums;border-top:1px solid transparent}
  .col{position:relative;border-right:1px solid var(--line)}
  .col:last-child{border-right:none}
  .col .slot{border-top:1px dashed var(--line)}
  /* Board edge colours mirror Skedda: blue = recurring renter (contract),
     green = Artist Plan (AAP), yellow = one-off, red = missed booking. */
  /* Skedda colours: blue = recurring renter (contract), green = Artist Plan
     (AAP), yellow = one-off, red = missed booking. Tinted fill + an even 2px
     solid border in the same colour (no dashed edges anywhere). */
  .booking{--sk:#f0b400;--sk-fill:18%;
           position:absolute;left:7px;right:7px;border-radius:8px;padding:7px 10px 6px;overflow:hidden;
           background:color-mix(in srgb,var(--sk) var(--sk-fill),var(--scrim));
           border:2px solid var(--sk);box-shadow:var(--shadow)}
  .booking.plan-contract{--sk:#2f6fd0}
  .booking.plan-aap{--sk:#17a673}
  .booking.plan-oneoff{--sk:#f0b400}
  .booking.plain{--sk:var(--chalk-faint)}
  .booking.cleaning{background:repeating-linear-gradient(-45deg,var(--scrim-2) 0 7px,var(--scrim) 7px 14px);
                    --sk:var(--chalk-faint);box-shadow:none}
  .booking.done{opacity:.6}
  .booking.live{--sk-fill:30%;box-shadow:0 0 0 1px var(--sk),var(--shadow)}
  .booking.flagged{--sk:#d93b30;box-shadow:0 0 0 1px #d93b30,var(--shadow)}
  @media (prefers-color-scheme: dark){ .booking{--sk-fill:26%} .booking.live{--sk-fill:38%} }
  :root[data-theme="dark"] .booking{--sk-fill:26%}
  :root[data-theme="dark"] .booking.live{--sk-fill:38%}
  :root[data-theme="light"] .booking{--sk-fill:18%}
  :root[data-theme="light"] .booking.live{--sk-fill:30%}
  .booking .who{font-weight:600;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .booking .when{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
  .booking .when .arr{color:var(--ok)} .booking .when .flag{color:var(--crit);font-family:var(--body)}
  .chips{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--tungsten);z-index:8;pointer-events:none}
  .nowline::before{content:"";position:absolute;left:-1px;top:-5px;width:8px;height:8px;border-radius:50%;
                   background:var(--tungsten)}
  .nowline::after{content:"";position:absolute;inset:-2px 0 auto 0;height:2px;background:var(--tungsten);
                  filter:blur(4px);opacity:.7;animation:pulse 2.4s ease-in-out infinite}
  .board .chip.type{background:var(--tungsten-soft);color:var(--tungsten)}   /* board keeps soft chips */

  /* staff coverage */
  .staffcol{position:relative;border-right:1px solid var(--line);background:var(--tungsten-soft)}
  .staffcol .slot{border-top:1px dashed var(--line)}
  /* Concurrent staff sit in side-by-side lanes (left/width set inline) so blocks
     never stack on top of each other. Short blocks drop the time line rather
     than clipping it into a row of half-glyphs. */
  .staffblock{position:absolute;left:5px;right:5px;border-radius:8px;padding:4px 7px;overflow:hidden;
              display:flex;flex-direction:column;justify-content:center;
              background:var(--tungsten);color:#fff;box-shadow:var(--shadow)}
  .staffblock .who{font-weight:700;font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .staffblock .when{font-family:var(--mono);font-size:10.5px;line-height:1.25;opacity:.9;
                    white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
  .staffblock.tight .when{display:none}
  .coverband{position:absolute;right:0;background:var(--tungsten-soft);pointer-events:none;z-index:1}
  .booking{z-index:2}

  /* ── alarms + robots tabs ── */
  .armgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
  .armcard{background:var(--scrim);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
           box-shadow:var(--shadow)}
  .armcard .id{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:.02em}
  .armcard .st{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.08em;
               text-transform:uppercase;margin-top:2px}
  .armcard .st.open{color:var(--ok)} .armcard .st.locked{color:var(--chalk-dim)}
  .armcard .st.unknown{color:var(--chalk-faint)}
  .armcard.alarm{border-color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit),var(--shadow)}
  .armcard .last{font-size:12.5px;color:var(--chalk-dim);margin-top:6px;line-height:1.35}
  .armcard .last b{font-family:var(--mono);font-weight:600;color:var(--chalk)}
  .robot{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;padding:11px 16px;
         border-bottom:1px solid var(--line);align-items:center}
  .robot:last-child{border-bottom:none}
  .robot .nm{font-weight:600;font-size:15.5px;min-width:0}
  .robot .nm small{display:block;font-weight:400;font-size:12px;color:var(--chalk-dim)}
  .robot .ago{font-family:var(--mono);font-size:13px;color:var(--chalk-dim);white-space:nowrap;
              font-variant-numeric:tabular-nums;text-align:right}
  .robot.dim{opacity:.55}
  @media (max-width:640px){ .robot{grid-template-columns:minmax(0,1fr) auto} .robot .ago{grid-column:1;text-align:left} }

  footer{max-width:1140px;margin:26px auto 0;padding:0 24px;color:var(--chalk-faint);font-size:12.5px;
         display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .legend{display:flex;gap:16px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .swatch{width:14px;height:10px;border-radius:3px;display:inline-block}
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">Dance Annex · Front-of-Building Support</div>
    <h1 id="daytitle">FBS <em>Monitor</em></h1>
  </div>
  <div class="summary" id="summary"></div>
  <div class="clockwrap">
    <div class="clock"><span class="dot" aria-hidden="true"></span><span id="clock">--:--</span><small>Toronto</small></div>
    <button id="refreshbtn" class="datastamp" type="button" aria-label="Refresh data" title="Pull the newest edition">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      <span id="freshness">data —</span>
    </button>
  </div>
</header>

<main>
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab on" data-tab="studios" role="tab" aria-selected="true">Studios</button>

/* Freshness + refresh. The page is a static edition rebuilt every 15 min. Refresh
   probes for a newer pushed edition in the background (cache-busted fetch, compare
   generatedAtISO); when one exists it reloads the page with a cache-buster.
   The button cannot rebuild data — ceiling = rebuild cadence. */
(function(){
  const btn = document.getElementById('refreshbtn');
  const fresh = document.getElementById('freshness');
  let flashTimer = null;
  function paintAge(){
    const iso = DATA.generatedAtISO;
    if(!iso){ fresh.textContent = "edition " + (DATA.generatedAt||"—"); return; }
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/60000));
    // Rebuilds pause 03:00–07:00 Toronto (build.py quiet hours) — old data then
    // is expected, not an outage. Red-flag staleness only during operating hours.
    const etHour = +new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",hour:"numeric",hour12:false}).format(new Date());
    const quiet = etHour >= 3 && etHour < 7;
    const stale = !quiet && mins > 40;
    btn.classList.toggle('stale', stale);
    fresh.textContent = quiet ? "overnight — resumes 7 AM"
                      : stale ? "data " + mins + " min old — rebuild down?"
                      : mins < 1 ? "data live" : "data " + mins + " min old";
  }
  function flash(msg){
    clearTimeout(flashTimer);
    fresh.textContent = msg;
    flashTimer = setTimeout(paintAge, 2200);
  }
  async function refresh(silent){
    btn.classList.add('busy');
    try{
      const res = await fetch(location.pathname + '?r=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error(res.status);
      const html = await res.text();
      const m = html.match(/"generatedAtISO"\s*:\s*"([^"]+)"/);
      if(m && DATA.generatedAtISO && m[1] === DATA.generatedAtISO){
        if(!silent) flash("latest edition ✓");
        return;
      }
      location.replace(location.pathname + '?r=' + Date.now());
    }catch(e){
      if(!silent) flash("refresh unavailable here");
    }finally{
      btn.classList.remove('busy');
    }
  }
  btn.addEventListener('click', () => refresh(false));
  paintAge(); setInterval(paintAge, 30000);
  setInterval(() => refresh(true), 5*60000);   // silent auto-pull every 5 min
})();

const E = DATA.events;
const hm = t => `${String(Math.floor(t)%24).padStart(2,"0")}:${String(Math.round((t%1)*60)).padStart(2,"0")}`;
const parseHM = s => { if(!s) return null; const m=s.match(/^(\d{1,2}):(\d{2})$/); return m? +m[1]+ +m[2]/60 : null; };
const dur = h => { const m=Math.round(h*60); return m>=60? `${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m` : `${m} min`; };
const GRACE = 10/60; // minutes past start before a missing arrival flags
const STAFF = DATA.staff || []; // on-site coverage blocks from the Staff Scheduling calendar

/* Presence-based coverage: a monitored booking (tier != null) is Covered when the
   union of staff on-site blocks spans its window; Partial shows uncovered minutes. */
function coverageOf(e){
  if(e.kind!=="booking" || !e.tier) return null;
  const segs = STAFF.map(s=>[Math.max(s.start,e.start), Math.min(s.end,e.end)])
                    .filter(([a,b])=>b>a).sort((a,b)=>a[0]-b[0]);
  let covered=0, cursor=e.start, names=new Set();
  for(const [a,b] of segs){ const from=Math.max(a,cursor); if(b>from){covered+=b-from; cursor=b;} }
  STAFF.forEach(s=>{ if(Math.min(s.end,e.end)>Math.max(s.start,e.start)) names.add(s.name); });
  const total=e.end-e.start, gap=Math.round((total-covered)*60);
  const who=[...names].join(" · ");
  if(covered<=0.004) return {cls:"cov-ai", label:"AI watch", gap:Math.round(total*60), who:""};
  if(gap<=1) return {cls:"cov-ok", label:"Covered"+(who?" · "+who:""), gap:0, who};
  return {cls:"cov-part", label:`Partial · ${gap}m gap`, gap, who};
}

function torontoNow(){ const d=new Date(new Date().toLocaleString("en-US",{timeZone:"America/Toronto"}));
  return {t: d.getHours()+d.getMinutes()/60, hhmm: String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}; }

function stateOf(e, now){
  const arr = parseHM(e.arrived), dep = parseHM(e.departed);
  const flagged = e.kind==="booking" && !arr && now > e.start + GRACE && now < e.end + 1;
  if(dep && dep >= e.start) return {label:"Complete", cls:"ok", flagged:false};
  if(now >= e.end) return arr ? {label:"Complete", cls:"ok", flagged:false}
                              : {label:"Ended", cls:"plain", flagged};
  if(now >= e.start) return arr ? {label:"In studio", cls:"type", flagged:false}
                                : {label:"Upcoming", cls:"plain", flagged};
  return {label:"Upcoming", cls:"plain", flagged:false};
}

/* One staff column: merge each person's overlapping / back-to-back shifts into a
   single block so the rail never stacks blocks on top of each other. Ela's
   18:00-18:15 + 18:15-18:45 + 18:30-19:00 becomes one 18:00-19:00 block. */
function staffBlocks(list){
  const by = new Map();
  for(const s of list) (by.get(s.name) || by.set(s.name, []).get(s.name)).push(s);
  const out = [];
  for(const [name, shifts] of by){
    shifts.sort((a,b)=>a.start-b.start);
    let cur = null;
    for(const s of shifts){
      if(cur && s.start <= cur.end + 1e-9){
        cur.end = Math.max(cur.end, s.end);
        if(s.role && !cur.roles.includes(s.role)) cur.roles.push(s.role);
      } else {
        cur = {name, start:s.start, end:s.end, roles: s.role ? [s.role] : []};
        out.push(cur);
      }
    }
  }
  return out.sort((a,b)=>a.start-b.start);
}

  const n = now.t;

  /* header summary line (replaces the stat-card grid) */
  const bookings = E.filter(e=>e.kind==="booking");
  const inNow = E.filter(e=>e.start<=n && n<e.end && e.kind==="booking").length;
  const flags = E.filter(e=>stateOf(e,n).flagged).length;
  const monitored = bookings.filter(e=>e.tier).length;
  const seg=[];
  seg.push(`<b class="${inNow?"good":""}">${inNow}</b> in studio`);
  seg.push(`<b>${bookings.length}</b> today`);
  if(monitored) seg.push(`<b>${monitored}</b> monitored`);
  seg.push(flags ? `<b class="bad">${flags}</b> flag${flags>1?"s":""}` : `<b class="good">0</b> flags`);
  $('#summary').innerHTML = seg.join('<span class="sep">·</span>');

  /* studio strips */
  const evCard = e => {
    const st = stateOf(e,n);
    const cv = coverageOf(e);
    const live = e.start<=n && n<e.end;
    const done = !live && n>=e.end;
    const cls = ["ev", live&&!st.flagged?"live":"", st.flagged?"flagged":"", done?"done":"",
                 e.kind==="cleaning"?"cleaning":"", e.tier&&e.tier!=="Monitor"?"tier-t":""].join(" ");
    // time cell: schedule on top, actuals directly beneath it
    let act = "";
    if(e.arrived)  act += `<span class="act">↓ ${e.arrived} in</span>`;
    if(e.departed) act += `<span class="act dep">↑ ${e.departed} out</span>`;

    // tags
    let tags = "";
    if(e.kind==="cleaning") tags += `<span class="chip plain">Staff</span>`;
    if(e.tier) tags += `<span class="chip ${e.tier==="Monitor"?"mon":"type"}">${e.tier}</span>`;
    if(e.tier && e.tier!=="Viewing" && !e.gtg && !done)
      tags += `<span class="chip ${live?"crit":"watch"}">No GTG</span>`;
    /* Coverage pills (Gap Nm / Covered / AI watch) were noise on the cards — the
       Staff tab still shows coverage per monitored booking. */
    // countdown
    let cnt = "";
    if(live) cnt = `<b>${dur(e.end-n)} left</b>`;
    else if(!done) cnt = e.start-n<6 ? `in ${dur(e.start-n)}` : `at ${hm(e.start)}`;
    else cnt = st.label==="Complete" ? "done" : "ended";
    return `<div class="${cls}" title="${esc(e.who)}">
      <div class="tm">${hm(e.start)}–${hm(e.end)}${act}</div>
      <div class="who"><span class="nm">${shortWho(e.who)}</span><span class="tags">${tags}</span></div>
      <div class="cnt">${cnt}</div>
    </div>`;
  };
  /* The "N things to watch" status bar was removed 2026-07-31 (Junyan) — alarms
     live on the Alarms tab and robots on the Robots tab; the banner only
     duplicated them at the top of every page. */
  $('#staffnow').innerHTML = "";

  $('#strips').innerHTML = DATA.studios.map(s=>{
    const evs = E.filter(e=>e.studio===s.id).sort((a,b)=>a.start-b.start);
    const occupied = evs.some(e=>e.kind==="booking" && e.start<=n && n<e.end);
    return `<div class="strip">
      <div class="stu"><div class="id">${s.name}</div>
        <div class="occ ${occupied?"live":"empty"}">${occupied?"Occupied":"Empty"}</div></div>
      <div class="lane">${evs.length? evs.map(evCard).join("") : `<div class="quiet">No bookings today</div>`}</div>
    </div>`;
  }).join("");

  /* staff tab: shifts + monitored-booking coverage */
  const shiftRow = s => {
    const live = s.start<=n && n<s.end, sdone = n>=s.end;
    return `<div class="shift ${live?"live":""} ${sdone?"done":""}">
      <span class="tm">${hm(s.start)}–${hm(s.end)}</span>
      <span class="nm">${esc(s.name)}</span>
      <span class="chip ${s.role==="Open"||s.role==="Close"?"plain":"type"}">${esc(s.role)}</span>
      <span class="chip ${live?"ok":sdone?"plain":"watch"}">${live?"On now":sdone?"Done":"Upcoming"}</span>
    </div>`;
  };
  const covRow = e => {
    const cv = coverageOf(e) || {cls:"cov-ai", label:"AI watch"};
    const live = e.start<=n && n<e.end, cdone = n>=e.end;
    return `<div class="shift ${live?"live":""} ${cdone?"done":""}" title="${esc(e.who)}">
      <span class="tm">${hm(e.start)}–${hm(e.end)}</span>
      <span class="nm">${shortWho(e.who)} <span class="chip plain">${e.studio}</span></span>
      <span class="chip ${e.tier==="Monitor"?"mon":"type"}">${e.tier}</span>
      <span class="chip ${cv.cls}">${esc(cv.label)}</span>
    </div>`;
  };
  const monBk = bookings.filter(e=>e.tier).sort((a,b)=>a.start-b.start);
  $('#staffpanel').innerHTML =
    `<p class="lane-label">Staff shifts</p>
     <div class="panelwrap">${STAFF.length? STAFF.map(shiftRow).join("") : '<div class="shift">No staff shifts today</div>'}</div>
     <p class="lane-label">Monitored bookings — coverage</p>
     <div class="panelwrap">${monBk.length? monBk.map(covRow).join("") : '<div class="shift">No monitored bookings today</div>'}</div>`;

  /* board */
  const lo = Math.min(9, ...E.map(e=>Math.floor(e.start)));
  const hi = Math.max(lo+8, ...E.map(e=>Math.ceil(e.end)));
  const HRS=[]; for(let h=lo;h<=hi;h++) HRS.push(h);
  const SLOT=52, yOf = t => (t-lo)*SLOT+46;
  const board = document.getElementById('board');
  const RAIL = STAFF.length ? 132 : 0;
  board.style.gridTemplateColumns = `56px ${RAIL?RAIL+"px ":""}repeat(${DATA.studios.length}, minmax(170px,1fr))`;
  let html = `<div class="timecol"><div class="studio-h" style="height:46px"></div>` +
    HRS.map(h=>`<div class="cell">${String(h%24).padStart(2,"0")}:00</div>`).join("") + `</div>`;
  if(RAIL){
    html += `<div class="staffcol">
      <div class="studio-h" style="height:46px"><h2>Staff</h2></div>` +
      HRS.slice(0,-1).map(()=>`<div class="slot"></div>`).join("") +
      staffBlocks(STAFF).map(s=>{
        const h = Math.max((s.end-s.start)*SLOT-6, 24);
        const role = s.roles.length===1 ? ` · ${esc(s.roles[0])}` : "";   // merged spans: name only
        return `<div class="staffblock ${h<34?"tight":""}" title="${esc(s.name)}${role} ${hm(s.start)}–${hm(s.end)}"
          style="top:${yOf(s.start)}px;height:${h}px">
        <div class="who">${esc(s.name)}${role}</div>
        <div class="when">${hm(s.start)}–${hm(s.end)}</div>
      </div>`;}).join("") + `</div>`;
  }
  for(const s of DATA.studios){
    html += `<div class="col">
      <div class="studio-h" style="height:46px"><h2>${s.name}</h2></div>` +
      HRS.slice(0,-1).map(()=>`<div class="slot"></div>`).join("") +
      E.filter(e=>e.studio===s.id).map(e=>{
        const st = stateOf(e,n);
        const live = e.start<=n && n<e.end;
        const done = n>=e.end;
        const cls = ["booking", e.kind==="cleaning"?"cleaning":`plan-${e.plan||"oneoff"}`,
                     e.kind!=="cleaning"&&e.tier==="Monitor"?"monitor":"",
                     done?"done":"", live&&!st.flagged?"live":"", st.flagged?"flagged":""].join(" ");
        return `<div class="${cls}" style="top:${yOf(e.start)}px;height:${Math.max((e.end-e.start)*SLOT-6,42)}px" title="${esc(e.who)}">
          <div class="who">${shortWho(e.who)}</div>
          <div class="when">${hm(e.start)}–${hm(e.end)}${e.arrived?` <span class="arr">↓${e.arrived}</span>`:""}${e.departed?` ↑${e.departed}`:""}${st.flagged?` <span class="flag">⚠</span>`:""}</div>
          ${e.tier?`<div class="chips"><span class="chip type">${e.tier}</span>${e.tier!=="Viewing"?(e.gtg?`<span class="chip ok">GTG ✓</span>`:`<span class="chip watch">No GTG</span>`):""}</div>`:""}
        </div>`;
      }).join("") + `</div>`;
  }
  board.innerHTML = html;
  for(const s of STAFF){
    const band = document.createElement('div'); band.className='coverband';
    band.style.left = (56+RAIL)+"px"; band.style.top = yOf(s.start)+"px";
    band.style.height = (s.end-s.start)*SLOT+"px";
    board.appendChild(band);
  }
  if(n>=lo && n<=hi){
    const line = document.createElement('div'); line.className='nowline'; line.style.top = yOf(n)+"px";
    board.appendChild(line);
  }
}
/* ── Alarms tab ─────────────────────────────────────────────────────────────
   State is DERIVED from today's ADT emails (since 05:00): last event per studio
   — disarm ⇒ open, arm ⇒ locked. No events yet ⇒ unknown (shown as such, never
   guessed). PENDING/ALARM trigger emails get the red banner. */
function renderAlarms(){
  const evs = DATA.armEvents || [];
  const alerts = DATA.alarmAlerts || [];
  let html = "";
  if(alerts.length){
    const real = alerts.some(a=>a.stage==="ALARM");
    html += `<div class="statusbar ${real?"crit":"warn"}" style="margin-top:16px"><span class="dot"></span>
      <span class="head">${real?"Alarm triggered":"Pending alarm"}</span><span class="items">${
      alerts.map(a=>`<span class="statusitem"><span class="sdot ${a.stage==="ALARM"?"crit":"warn"}"></span>${esc(a.studio)} · ${esc(a.stage.toLowerCase())} · ${esc(a.time)}</span>`).join("")}</span></div>`;
  }
  if(DATA.armFallback)
    html += `<div class="statusbar warn" style="margin-top:16px"><span class="dot"></span>
      <span class="head">ADT email feed unavailable</span><span class="items"><span class="statusitem">Showing board fallback — no event stream this edition</span></span></div>`;
  html += `<div class="armgrid">` + DATA.studios.map(s=>{
    const mine = evs.filter(e=>e.studio===s.id);
    const last = mine[mine.length-1];
    const alarmed = alerts.some(a=>a.studio===s.id);
    const st = !last ? ["unknown","No events yet"]
             : last.kind==="arrival" ? ["open","🔓 Open"] : ["locked","🔒 Armed"];
    return `<div class="armcard ${alarmed?"alarm":""}">
      <div class="id">${esc(s.name)}</div>
      <div class="st ${st[0]}">${st[1]}</div>
      <div class="last">${last ? `<b>${esc(last.time)}</b> ${last.kind==="arrival"?"disarmed":"armed"} · ${esc(last.name||"")}` : "since 5 AM"}</div>
    </div>`;
  }).join("") + `</div>`;
  html += `<p class="lane-label">Today's arm / disarm events</p><div class="panelwrap">` +
    (evs.length ? evs.slice().reverse().map(e=>`<div class="shift">
        <span class="tm">${esc(e.time)}</span>
        <span class="nm">${esc(e.name||"—")} <span class="chip plain">${esc(e.studio)}</span></span>
        <span class="chip ${e.kind==="arrival"?"ok":"plain"}">${e.kind==="arrival"?"↓ Disarmed":"↑ Armed"}</span>
      </div>`).join("")
     : `<div class="shift">No alarm events yet today</div>`) + `</div>`;
  $('#alarmpanel').innerHTML = html;
}

/* ── Robots tab ─────────────────────────────────────────────────────────────
   Read-only projection of the 🚥 Run Monitor DB. This page is a scoreboard,
   not a watchdog — The Sentinel still does the alerting; check the header
   freshness stamp before trusting a green board. */
function agoTxt(iso){
  if(!iso) return "never";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/60000));
  if(m < 60) return m + "m ago";
  if(m < 48*60) return Math.round(m/60) + "h ago";
  return Math.round(m/1440) + "d ago";
}
function renderRobots(){
  const R = DATA.robots;
  if(!R){
    $('#robotpanel').innerHTML = `<div class="statusbar warn" style="margin-top:16px"><span class="dot"></span>
      <span class="head">Roster unavailable</span><span class="items"><span class="statusitem">${esc(DATA.robotsNote||"Run Monitor could not be read this edition")}</span></span></div>`;
    return;
  }
  const overdue = R.filter(r=>r.status==="crit").length;
  const watched = R.filter(r=>r.monitoring==="Live").length;
  const head = overdue ? `${overdue} robot${overdue>1?"s":""} overdue` : "All robots reporting";
  let html = `<div class="statusbar ${overdue?"crit":"ok"}" style="margin-top:16px"><span class="dot"></span>
    <span class="head">${head}</span><span class="items"><span class="statusitem">${watched} watched · as of the last rebuild — The Sentinel does the paging, this is the glanceable view</span></span></div>`;
  const row = r => {
    const chip = {ok:"ok", watch:"watch", crit:"crit", plain:"plain"}[r.status] || "plain";
    return `<div class="robot ${r.status==="plain"?"dim":""}">
      <span class="nm">${esc(r.run)}<small>${esc(r.expected||r.cadence||"")}${r.produces?` · ${esc(r.produces)}`:""}</small></span>
      <span class="chip ${chip}">${esc(r.statusLabel)}</span>
      <span class="ago">${agoTxt(r.lastISO)}</span>
    </div>`;
  };
  const live = R.filter(r=>r.monitoring==="Live");
  const rest = R.filter(r=>r.monitoring!=="Live");
  html += `<p class="lane-label">Watched runs</p><div class="panelwrap">` +
    (live.length ? live.map(row).join("") : `<div class="robot">Nothing watched</div>`) + `</div>`;
  if(rest.length)
    html += `<p class="lane-label">Paused / not reporting</p><div class="panelwrap">${rest.map(row).join("")}</div>`;
  $('#robotpanel').innerHTML = html;
}

const _renderBase = render;
render = function(){ _renderBase(); renderAlarms(); renderRobots(); };
render(); setInterval(render, 30000);
</script>

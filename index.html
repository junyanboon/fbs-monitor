<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<title>FBS Studio Monitor — Dance Annex</title>
<!-- Same "pulse tile" icon as site/favicon.svg, inlined so the artifact copy is self-contained -->
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="7" fill="%232c7a4e"/><polyline points="5,16 11,16 14,9 18,23 21,16 27,16" fill="none" stroke="%23f4f2ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'>
<!-- Web-app install (PWA): manifest + iOS standalone metas. Relative paths resolve
     under /fbs-monitor/ on Pages; harmless in other contexts. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2c7a4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="FBS Monitor">
<style>
  /* Palette: Day Sheet system (junyanboon.github.io/day-sheet) — paper ground,
     purple brand, act/wait/hot/done semantics. Light-first, like the Day Sheet.
     Layout: "Design C — studio strips" (approved 2026-07-19): one strip per studio,
     occupancy stamped at the left edge, tier as a colored card edge. */
  :root{
    --ink:#f5f4f0; --scrim:#fbfaf7; --scrim-2:#edebe4; --line:#dedbd3;
    --chalk:#191715; --chalk-dim:#716c64; --chalk-faint:#a09a90;
    --tungsten:#5b2fd4; --tungsten-soft:rgba(91,47,212,.09);
    --ok:#2c7a4e; --watch:#b06c00; --crit:#c23a2b;
    --ok-bg:#e2efe7; --watch-bg:#f6ead6; --crit-bg:#f9e6e2;
    --live-bg:#eef3ec; --live-line:#bcd4c2;
    --shadow:0 6px 18px rgba(25,23,21,.07);
    --disp:"Avenir Next Condensed","Arial Narrow","Helvetica Neue",sans-serif;
    --sans:"Avenir Next",Avenir,Seravek,"Segoe UI",Ubuntu,sans-serif;
    --body:Seravek,"Avenir Next","Segoe UI",Ubuntu,sans-serif;
    --mono:"SF Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#161412; --scrim:#1e1b18; --scrim-2:#2a2622; --line:#403b34;
      --chalk:#f4f1ea; --chalk-dim:#beb7ab; --chalk-faint:#948d82;
      --tungsten:#b598f5; --tungsten-soft:rgba(181,152,245,.18);
      --ok:#82cda2; --watch:#eab365; --crit:#f08a7b;
      --ok-bg:#1d3527; --watch-bg:#3d2f12; --crit-bg:#46221c;
      --live-bg:#20312a; --live-line:#41604e;
      --shadow:0 8px 24px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="light"]{
    --ink:#f5f4f0; --scrim:#fbfaf7; --scrim-2:#edebe4; --line:#dedbd3;
    --chalk:#191715; --chalk-dim:#716c64; --chalk-faint:#a09a90;
    --tungsten:#5b2fd4; --tungsten-soft:rgba(91,47,212,.09);
    --ok:#2c7a4e; --watch:#b06c00; --crit:#c23a2b;
    --ok-bg:#e2efe7; --watch-bg:#f6ead6; --crit-bg:#f9e6e2;
    --live-bg:#eef3ec; --live-line:#bcd4c2;
    --shadow:0 6px 18px rgba(25,23,21,.07);
  }
  :root[data-theme="dark"]{
    --ink:#161412; --scrim:#1e1b18; --scrim-2:#2a2622; --line:#403b34;
    --chalk:#f4f1ea; --chalk-dim:#beb7ab; --chalk-faint:#948d82;
    --tungsten:#b598f5; --tungsten-soft:rgba(181,152,245,.18);
    --ok:#82cda2; --watch:#eab365; --crit:#f08a7b;
    --ok-bg:#1d3527; --watch-bg:#3d2f12; --crit-bg:#46221c;
    --live-bg:#20312a; --live-line:#41604e;
    --shadow:0 8px 24px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--ink);color:var(--chalk);font-family:var(--body);font-size:16.5px;line-height:1.5;
       -webkit-font-smoothing:antialiased;padding:0 0 64px}

  /* ── slim header: title · summary · clock+freshness ── */
  header{position:sticky;top:0;z-index:30;background:var(--ink);border-bottom:1px solid var(--line);
         padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
  .brand{font-family:var(--sans);font-weight:600;letter-spacing:.24em;text-transform:uppercase;
         font-size:10px;color:var(--chalk-dim)}
  h1{font-family:var(--disp);font-weight:800;font-size:clamp(19px,2.6vw,26px);margin:0;letter-spacing:.02em;
     text-transform:uppercase;line-height:1}
  h1 em{font-style:normal;color:var(--tungsten)}
  h1 small{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:.05em;color:var(--chalk-dim);
           text-transform:none;margin-left:10px}
  .summary{font-size:14.5px;color:var(--chalk-dim);margin-left:auto;font-variant-numeric:tabular-nums}
  .summary b{color:var(--chalk);font-weight:700}
  .summary b.good{color:var(--ok)} .summary b.warn{color:var(--watch)} .summary b.bad{color:var(--crit)}
  .summary .sep{margin:0 7px;color:var(--chalk-faint)}
  .clockwrap{display:flex;flex-direction:column;align-items:flex-end;gap:1px;
             padding-left:18px;border-left:1px solid var(--line)}
  .clock{font-family:var(--mono);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;
         color:var(--chalk);display:flex;align-items:center;gap:8px;line-height:1.1}
  .clock small{font-family:var(--body);font-size:10.5px;font-weight:400;color:var(--chalk-dim);
               letter-spacing:.08em;text-transform:uppercase}
  .clock .dot{width:8px;height:8px;border-radius:50%;background:var(--tungsten);
              animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--tungsten-soft)}50%{opacity:.55;box-shadow:0 0 0 7px transparent}}
  .datastamp{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:2px 0;cursor:pointer;
             font-family:var(--sans);font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
             color:var(--ok);transition:color .15s ease}
  .datastamp:hover,.datastamp:focus-visible{color:var(--tungsten);outline:none}
  .datastamp svg{width:12px;height:12px;flex:none}
  .datastamp.busy svg{animation:spin .8s linear infinite}
  .datastamp.stale{color:var(--crit)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ .clock .dot{animation:none} .nowline::after{animation:none} }

  main{max-width:1140px;margin:0 auto;padding:0 24px}

  /* ── tabs ── */
  .tabs{display:flex;gap:4px;margin-top:16px;border-bottom:1px solid var(--line)}
  .tabs .tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 16px;cursor:pointer;
             font-family:var(--sans);font-weight:700;font-size:13.5px;letter-spacing:.08em;
             text-transform:uppercase;color:var(--chalk-dim)}
  .tabs .tab.on{color:var(--chalk);border-bottom-color:var(--tungsten)}
  .tabs .tab:hover{color:var(--chalk)}
  .tabs .tab:focus-visible{outline:2px solid var(--tungsten);outline-offset:-2px}
  /* External surfaces styled as ordinary tabs — the Deck/Docket run as Claude
     artifacts because they write to Notion with the viewer's own login; they
     cannot be hosted on Pages, so these tabs open them in a new browser tab. */
  .tabs .tabx{display:inline-block;padding:10px 16px;border-bottom:3px solid transparent;
              font-family:var(--sans);font-weight:700;font-size:13.5px;letter-spacing:.08em;
              text-transform:uppercase;color:var(--chalk-dim);text-decoration:none}
  .tabs .tabx:hover{color:var(--chalk)}
  .tabs .tabx:focus-visible{outline:2px solid var(--tungsten);outline-offset:-2px}

  /* status bar (Studios tab) — status.claude.com-style: one overall state, plus
     any items from the analyst report. Grade-3 wording, colour = severity. */
  /* Spacing uses margins, not flex `gap`: older iOS Safari (the home-screen web app)
     ignores gap, which collapsed the dot onto the text. Margins work everywhere. */
  .statusbar{margin-top:16px;padding:12px 16px;border-radius:10px;border:1px solid var(--line);
             background:var(--scrim);display:flex;flex-wrap:wrap;align-items:center}
  .statusbar .dot{width:11px;height:11px;border-radius:50%;flex:none;display:inline-block;
                  margin-right:10px}
  .statusbar .head{font-weight:800;font-size:15.5px;white-space:nowrap;margin-right:12px}
  .statusbar.ok{background:var(--ok-bg);border-color:transparent}
  .statusbar.ok .dot{background:var(--ok)}  .statusbar.ok .head{color:var(--ok)}
  .statusbar.warn{background:var(--watch-bg);border-color:transparent}
  .statusbar.warn .dot{background:var(--watch)} .statusbar.warn .head{color:var(--watch)}
  .statusbar.crit{background:var(--crit-bg);border-color:transparent}
  .statusbar.crit .dot{background:var(--crit)} .statusbar.crit .head{color:var(--crit)}
  .statusbar .items{display:flex;flex-wrap:wrap}
  .statusitem{display:inline-flex;align-items:center;background:var(--scrim);
              border:1px solid var(--line);border-radius:99px;padding:4px 12px;
              font-weight:700;font-size:14px;color:var(--chalk);margin:3px 8px 3px 0}
  .statusitem .sdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;
                    margin-right:7px}
  .statusitem .sdot.info{background:var(--tungsten)}
  .statusitem .sdot.warn{background:var(--watch)}
  .statusitem .sdot.crit{background:var(--crit)}

  /* staff tab panels */
  .panelwrap{background:var(--scrim);border:1px solid var(--line);border-radius:12px;overflow:hidden;
             box-shadow:var(--shadow)}
  .shift{display:grid;grid-template-columns:132px minmax(0,1fr) auto auto;gap:12px;padding:11px 16px;
         border-bottom:1px solid var(--line);align-items:center}
  .shift:last-child{border-bottom:none}
  .shift.live{background:var(--live-bg);box-shadow:inset 4px 0 0 var(--ok)}
  .shift.openshift{background:var(--watch-bg);box-shadow:inset 4px 0 0 var(--watch)}
  .shift.done{opacity:.65}
  .shift .tm{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
  .shift .nm{font-weight:600;font-size:15.5px;min-width:0}
  /* The panel ledger records WHEN, never WHO. A bare em-dash read as a
     broken renderer, so say what is actually missing and why. */
  .hintnote{margin:10px 2px 0;font-size:12.5px;line-height:1.5;color:var(--chalk-faint);max-width:78ch}
  .shift .nm.none{font-weight:400;font-size:13px;color:var(--chalk-faint);font-style:italic}

  .lane-label{font-family:var(--sans);font-weight:600;font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;
              color:var(--chalk-dim);margin:26px 0 10px;display:flex;align-items:center;gap:10px}
  .lane-label::after{content:"";flex:1;height:1px;background:var(--line)}
  /* outbound Notion button — the work (claiming, releasing) happens there */
  .nbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:99px;
        background:var(--tungsten);color:#fff;font-family:var(--sans);font-weight:700;
        font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;
        box-shadow:var(--shadow);margin:2px 0 14px}
  .nbtn:hover{filter:brightness(1.08)}
  .nbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;
            stroke-linecap:round;stroke-linejoin:round}
  .lane-label .crit-note{color:var(--crit);letter-spacing:.06em}

  /* ── studio strips ── */
  .strips{background:var(--scrim);border:1px solid var(--line);border-radius:12px;overflow:hidden;
          box-shadow:var(--shadow);margin-top:18px}
  .strip{display:grid;grid-template-columns:104px 1fr;border-bottom:1px solid var(--line)}
  .strip:last-child{border-bottom:none}
  .stu{padding:14px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;
       justify-content:center;gap:4px}
  .stu .id{font-family:var(--disp);font-weight:800;font-size:29px;letter-spacing:.02em;line-height:1}
  .stu .occ{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .stu .occ.live{color:var(--ok)} .stu .occ.empty{color:var(--chalk-faint);font-weight:600}
  .lane{padding:10px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .lane .quiet{font-size:14px;color:var(--chalk-faint);padding:4px 2px}
  .ev{display:grid;grid-template-columns:118px minmax(0,1fr) auto;gap:12px;align-items:center;
      padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--ink)}
  .ev.live{background:var(--live-bg);border-color:var(--live-line);box-shadow:inset 4px 0 0 var(--ok)}
  .ev.flagged{background:var(--crit-bg);border-color:var(--crit);box-shadow:inset 4px 0 0 var(--crit)}
  /* Same renter in two studios: still a flag, still counted — amber, because
     red here would assert a no-show the builder cannot actually confirm. */
  .ev.done{opacity:.68}
  .ev.tier-t{border-left:4px solid var(--tungsten)}
  .ev.live.tier-t,.ev.flagged.tier-t{border-left-width:1px}  /* live/flag edge wins */
  .ev.staff{background:repeating-linear-gradient(-45deg,var(--scrim-2) 0 7px,var(--scrim) 7px 14px)}
  .ev .tm{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums;line-height:1.4}
  .ev .tm .act{display:block;font-size:12.5px;color:var(--ok)}
  .ev .tm .act.dep{color:var(--chalk-dim)}
  .ev .tm .act.miss{color:var(--crit);font-family:var(--body);letter-spacing:.02em}
  /* Wrong studio is not a no-show — same urgency, distinct colour so the two
     don't read as one condition at a glance. */
  .ev .tm .act.wrong{color:var(--watch);font-family:var(--body);letter-spacing:.02em}
  .ev .who{font-size:16px;font-weight:600;min-width:0}
  .ev .who .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block;
               max-width:100%;vertical-align:bottom}
  .ev .tags{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle;flex-wrap:wrap}
  /* Session verdict glyph (verdictOf): last in the tag cluster, so it reads as
     the verdict ON the booking rather than another attribute of it. */
  .verdict{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;
           border-radius:99px;font-family:var(--sans);font-size:12px;font-weight:700;line-height:1;
           cursor:default;flex:none}
  .verdict.ok{background:var(--ok-bg);color:var(--ok)}
  .verdict.odd{background:var(--watch-bg);color:var(--watch)}
  .verdict.bad{background:var(--crit);color:#fff}
  /* Warnings column (was the countdown, dropped 2026-08-25 — the timeline
     itself says where things stand). */
  .ev .warns{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  /* Approved 2026-08-30: AVA/EOB live in a dedicated right-side dispatch
     cluster, separate from tier and booking-state warnings. Each segment is a
     public-safe projection: kind + state/time only. */
  .dispatch-cluster{display:flex;justify-content:flex-end;gap:5px;margin-top:2px;flex-wrap:wrap}
  .dispatch-seg{display:inline-grid;grid-template-columns:auto auto;overflow:hidden;border:1px solid var(--line);
                border-radius:7px;background:var(--scrim);font-family:var(--mono);font-size:10.5px;
                font-weight:700;line-height:1;white-space:nowrap}
  .dispatch-seg .dk{padding:5px 6px;background:var(--scrim-2);color:var(--chalk-faint);
                    font-family:var(--sans);font-size:9px;letter-spacing:.08em}
  .dispatch-seg .dv{padding:5px 7px;color:var(--chalk)}
  .dispatch-seg.scheduled.ava{border-color:color-mix(in srgb,#2f6fd0 30%,var(--line))}
  .dispatch-seg.scheduled.ava .dk{background:color-mix(in srgb,#2f6fd0 12%,var(--scrim));color:#2f6fd0}
  .dispatch-seg.scheduled.eob{border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
  .dispatch-seg.scheduled.eob .dk{background:var(--ok-bg);color:var(--ok)}
  .dispatch-seg.missing,.dispatch-seg.stuck,.dispatch-seg.awaiting{border-color:color-mix(in srgb,var(--crit) 40%,var(--line));background:var(--crit-bg)}
  .dispatch-seg.missing .dk,.dispatch-seg.stuck .dk,.dispatch-seg.awaiting .dk{background:color-mix(in srgb,var(--crit) 15%,var(--scrim));color:var(--crit)}
  .dispatch-seg.missing .dv,.dispatch-seg.stuck .dv,.dispatch-seg.awaiting .dv{color:var(--crit)}
  /* Mini timeline: the bordered track IS the booked window, identical length
     on every card; presence >16 min outside it is an amber stub added OUTSIDE
     the track so the window never shrinks. */
  .ev .tl{margin-top:4px}
  .ev .tl .strip{display:flex;align-items:stretch;height:6px;width:fit-content}
  .ev .tl .track{position:relative;width:190px;border-radius:99px;background:var(--scrim-2);
                 border:1px solid var(--line)}
  .ev .tl .fill{position:absolute;top:-1px;bottom:-1px;border-radius:99px;background:var(--ok)}
  .ev .tl .fill.liveseg{background:linear-gradient(90deg,var(--ok),var(--ok) 70%,transparent)}
  .ev .tl .over{background:var(--watch);border-radius:99px;width:20px}
  .ev .tl .over.pre{margin-right:2px}
  .ev .tl .over.post{margin-left:2px}
  .ev .tl .ends{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);
                font-size:11.5px;color:var(--chalk-faint);margin-top:2px;
                font-variant-numeric:tabular-nums;max-width:214px}
  .ev .tl .ends span{white-space:nowrap}
  .ev .tl .ends .a{color:var(--ok)} .ev .tl .ends .w{color:var(--watch)} .ev .tl .ends .x{color:var(--crit)}
  .ev .tl .ends.assumed-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;
                            gap:6px;width:214px}
  .ev .tl .ends .signal{display:inline-flex;align-items:center;padding:2px 5px;border-radius:3px;
                        background:var(--watch-bg);color:var(--watch);font-family:var(--sans);
                        font-size:8px;font-weight:700;line-height:1.1;letter-spacing:.05em;
                        text-transform:uppercase;white-space:nowrap;justify-self:center}
  .chip{font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;padding:2px 8px;border-radius:99px;font-weight:600;
        text-transform:uppercase;display:inline-block}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .chip.watch{background:var(--watch-bg);color:var(--watch)}
  .chip.crit{background:var(--crit-bg);color:var(--crit)}
  .chip.type{background:var(--tungsten);color:#fff}
  .chip.mon{background:var(--ok);color:#fff}
  .chip.plain{background:var(--scrim-2);border:1px solid var(--line);color:var(--chalk-dim)}
  .chip.cov-ok{background:var(--ok-bg);color:var(--ok)}
  .chip.cov-part{background:var(--watch-bg);color:var(--watch)}
  .chip.cov-no{background:var(--crit-bg);color:var(--crit)}
  .chip.cov-ai{background:var(--tungsten-soft);color:var(--tungsten)}
  @media (max-width:640px){
    .strip{grid-template-columns:72px 1fr}
    .ev{grid-template-columns:88px minmax(0,1fr)}
    .ev .cnt{grid-column:2;text-align:left}
    .ev .warns{grid-column:2;align-items:flex-start}
    .dispatch-cluster{justify-content:flex-start}
    .summary{width:100%;order:5;margin-left:0}
  }

  /* ── board (timeline, unchanged mechanics) ── */
  .boardwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--scrim)}
  .board{display:grid;min-width:980px;position:relative}
  .studio-h{position:sticky;top:0;background:var(--scrim-2);border-bottom:1px solid var(--line);
            padding:12px 14px;z-index:5;text-align:center}
  .studio-h h2{margin:0;font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
  .studio-h .sub{font-size:11.5px;color:var(--chalk-dim);letter-spacing:.07em;text-transform:uppercase}
  .timecol{border-right:1px solid var(--line)}
  .timecol .cell, .col .slot{height:52px}
  .timecol .cell{font-family:var(--mono);font-size:11px;color:var(--chalk-faint);text-align:right;
                 padding:2px 8px 0 0;font-variant-numeric:tabular-nums;border-top:1px solid transparent}
  .col{position:relative;border-right:1px solid var(--line)}
  .col:last-child{border-right:none}
  .col .slot{border-top:1px dashed var(--line)}
  /* Board edge colours mirror Skedda: blue = recurring renter (contract),
     green = Artist Plan (AAP), yellow = one-off, red = missed booking. */
  /* Skedda colours: blue = recurring renter (contract), green = Artist Plan
     (AAP), yellow = one-off, red = missed booking. Tinted fill + an even 2px
     solid border in the same colour (no dashed edges anywhere). */
  .booking{--sk:#f0b400;--sk-fill:18%;
           position:absolute;left:7px;right:7px;border-radius:8px;padding:7px 10px 6px;overflow:hidden;
           background:color-mix(in srgb,var(--sk) var(--sk-fill),var(--scrim));
           border:2px solid var(--sk);box-shadow:var(--shadow)}
  .booking.plan-contract{--sk:#2f6fd0}
  .booking.plan-aap{--sk:#17a673}
  .booking.plan-oneoff{--sk:#f0b400}
  .booking.plain{--sk:var(--chalk-faint)}
  .booking.staff{background:repeating-linear-gradient(-45deg,var(--scrim-2) 0 7px,var(--scrim) 7px 14px);
                 --sk:var(--chalk-faint);box-shadow:none}
  .booking.done{opacity:.6}
  .booking.live{--sk-fill:30%;box-shadow:0 0 0 1px var(--sk),var(--shadow)}
  .booking.flagged{--sk:#d93b30;box-shadow:0 0 0 1px #d93b30,var(--shadow)}
  @media (prefers-color-scheme: dark){ .booking{--sk-fill:26%} .booking.live{--sk-fill:38%} }
  :root[data-theme="dark"] .booking{--sk-fill:26%}
  :root[data-theme="dark"] .booking.live{--sk-fill:38%}
  :root[data-theme="light"] .booking{--sk-fill:18%}
  :root[data-theme="light"] .booking.live{--sk-fill:30%}
  /* Cards whose BOXES collide sit in side-by-side lanes (left/width set inline
     by bookingLayout). Without this a 15-minute viewing — 13px of real slot,
     floored to a 42px readable minimum — draws straight over the booking that
     follows it, which reads as a double-booking that isn't there. */
  .booking.laned{left:auto;right:auto}
  /* A short box that still has to carry chips: shrink the type rather than
     clip the chip row into a row of half-glyphs. */
  .booking.tight{padding:5px 8px 4px}
  .booking.tight .who{font-size:12.5px}
  .booking.tight .when{font-size:11px}
  .booking.tight .chips{margin-top:3px;gap:4px}
  .booking.tight .chip{font-size:9.5px;padding:1px 6px}
  .booking .who{font-weight:600;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .booking .when{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
  .booking .when .arr{color:var(--ok)} .booking .when .dep{color:var(--chalk-faint)}
  .booking .when .flag{color:var(--crit);font-family:var(--body)}
  .booking .when .wrongflag{color:var(--watch);font-family:var(--body)}
  .booking .when .lbl{font-family:var(--sans);font-size:8.5px;font-weight:700;letter-spacing:.08em;
                      vertical-align:1.5px;margin-right:1px}
  .chips{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
  .nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--tungsten);z-index:8;pointer-events:none}
  .nowline::before{content:"";position:absolute;left:-1px;top:-5px;width:8px;height:8px;border-radius:50%;
                   background:var(--tungsten)}
  .nowline::after{content:"";position:absolute;inset:-2px 0 auto 0;height:2px;background:var(--tungsten);
                  filter:blur(4px);opacity:.7;animation:pulse 2.4s ease-in-out infinite}
  .board .chip.type{background:var(--tungsten-soft);color:var(--tungsten)}   /* board keeps soft chips */

  /* staff coverage */
  .staffcol{position:relative;border-right:1px solid var(--line);background:var(--tungsten-soft)}
  .staffcol .slot{border-top:1px dashed var(--line)}
  /* Concurrent staff sit in side-by-side lanes (left/width set inline) so blocks
     never stack on top of each other. Short blocks drop the time line rather
     than clipping it into a row of half-glyphs. */
  .staffblock{position:absolute;left:5px;right:5px;border-radius:8px;padding:4px 7px;overflow:hidden;
              display:flex;flex-direction:column;justify-content:center;
              background:var(--tungsten);color:#fff;box-shadow:var(--shadow)}
  .staffblock .who{font-weight:700;font-size:12px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .staffblock .when{font-family:var(--mono);font-size:10.5px;line-height:1.25;opacity:.9;
                    white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
  .staffblock.tight .when{display:none}
  .coverband{position:absolute;right:0;background:var(--tungsten-soft);pointer-events:none;z-index:1}
  .booking{z-index:2}

  /* ── alarms + robots tabs ── */
  .armgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
  .armcard{background:var(--scrim);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
           box-shadow:var(--shadow)}
  .armcard .id{font-family:var(--disp);font-weight:800;font-size:24px;letter-spacing:.02em}
  .armcard .st{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.08em;
               text-transform:uppercase;margin-top:2px;
               display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  /* Panel-error pill, on the state line beside the lock. Alarm.com's System
     Event Notifications land in the same ADT label as the arm/disarm stream, so
     a fault shows up here within a rebuild. It rides next to 🔒 Armed rather
     than the studio name because the contradiction is the point: the lock says
     the room is fine and the pill says it is not. Credentials-in-conflict is
     filtered out in build.py — see TROUBLE_IGNORE. */
  .armcard .st .err{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.06em;
                    text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap;
                    background:var(--crit);color:#fff}
  .armcard .st .err.warn{background:var(--watch);color:#1a1408}
  .armcard .st.open{color:var(--ok)} .armcard .st.locked{color:var(--chalk-dim)}
  .armcard .st.unknown{color:var(--chalk-faint)}
  .armcard.alarm{border-color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit),var(--shadow)}
  .armcard .last{font-size:12.5px;color:var(--chalk-dim);margin-top:6px;line-height:1.35}
  .armcard .last b{font-family:var(--mono);font-weight:600;color:var(--chalk)}
  .robot{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;padding:11px 16px;
         border-bottom:1px solid var(--line);align-items:center}
  .robot:last-child{border-bottom:none}
  .robot .nm{font-weight:600;font-size:15.5px;min-width:0}
  .robot .nm small{display:block;font-weight:400;font-size:12px;color:var(--chalk-dim)}
  .robot .ago{font-family:var(--mono);font-size:13px;color:var(--chalk-dim);white-space:nowrap;
              font-variant-numeric:tabular-nums;text-align:right}
  .robot.dim{opacity:.55}
  /* Issues tab — one line each, scanned in a second, no wrapping games. The
     tag says the class, the text says the thing, the age says how stale. */
  .issue{display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:12px;padding:11px 16px;
         border-bottom:1px solid var(--line);align-items:baseline}
  .issue:last-child{border-bottom:none}
  .issue .tag{font-family:var(--sans);font-weight:700;font-size:10.5px;letter-spacing:.09em;
              text-transform:uppercase;color:var(--chalk-dim)}
  .issue.crit .tag{color:var(--crit)}
  .issue.watch .tag{color:var(--watch)}
  .issue .txt{font-size:15px;line-height:1.35;min-width:0}
  .issue.crit .txt{font-weight:600}
  .issue .ago{font-family:var(--mono);font-size:12.5px;color:var(--chalk-faint);white-space:nowrap;
              font-variant-numeric:tabular-nums;text-align:right}
  @media (max-width:640px){
    .issue{grid-template-columns:minmax(0,1fr) auto}
    .issue .tag{grid-column:1;font-size:10px}
    .issue .txt{grid-column:1/-1}
  }
  @media (max-width:640px){ .robot{grid-template-columns:minmax(0,1fr) auto} .robot .ago{grid-column:1;text-align:left} }

  footer{max-width:1140px;margin:26px auto 0;padding:0 24px;color:var(--chalk-faint);font-size:12.5px;
         display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .legend{display:flex;gap:16px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:7px}
  .swatch{width:14px;height:10px;border-radius:3px;display:inline-block}
  /* claim server (server/app.py): who is signed in, and the Claim control on open shifts */
  #who{display:flex;align-items:center;gap:8px;font-size:12.5px}
  #who a{color:var(--chalk-dim);text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px}
  #who a:hover{color:#fff}
  .claimbtn{font-family:var(--sans);font-size:11.5px;letter-spacing:.06em;font-weight:700;padding:3px 11px;border-radius:99px;
    border:0;background:var(--watch);color:#111;cursor:pointer;margin-left:6px}
  .claimbtn.plain{background:var(--scrim-2);color:var(--chalk-dim);border:1px solid var(--line)}
  .claimbtn:disabled{opacity:.5;cursor:default}
</style>
</head>

/* Freshness + refresh. The page is a static edition; refresh probes for a newer
   pushed edition and reloads onto it. The probe reads version.json (~60 bytes,
   written by build.py) rather than refetching this whole page — that is what
   makes a 30-second poll cheaper than the old 5-minute one, and it removes most
   of the client's share of arrival latency.
   The button cannot rebuild data — ceiling = rebuild cadence. */
(function(){
  const btn = document.getElementById('refreshbtn');
  const fresh = document.getElementById('freshness');
  let flashTimer = null;
  function paintAge(){
    const iso = DATA.generatedAtISO;
    if(!iso){ fresh.textContent = "edition " + (DATA.generatedAt||"—"); return; }
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/60000));
    // Rebuilds run hourly 03:00–07:00 Toronto (GitHub cron only, best-effort)
    // and every 15 min otherwise. Overnight, an hour-old board is expected, so
    // the red flag waits for 90 min there and 40 min during operating hours.
    const etHour = +new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",hour:"numeric",hour12:false}).format(new Date());
    const quiet = etHour >= 3 && etHour < 7;
    const stale = mins > (quiet ? 90 : 40);
    btn.classList.toggle('stale', stale);
    fresh.textContent = stale ? "data " + mins + " min old — rebuild down?"
                      : mins < 1 ? "data live"
                      : "data " + mins + " min old" + (quiet ? " · hourly overnight" : "");
  }
  function flash(msg){
    clearTimeout(flashTimer);
    fresh.textContent = msg;
    flashTimer = setTimeout(paintAge, 2200);
  }
  async function refresh(silent){
    btn.classList.add('busy');
    try{
      const base = location.pathname.replace(/[^/]*$/, '');
      const res = await fetch(base + 'version.json?r=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error(res.status);
      const live = (await res.json()).generatedAtISO;
      if(live && DATA.generatedAtISO && live === DATA.generatedAtISO){
        if(!silent) flash("latest edition ✓");
        return;
      }
      location.replace(location.pathname + '?r=' + Date.now());
    }catch(e){
      if(!silent) flash("refresh unavailable here");
    }finally{
      btn.classList.remove('busy');
    }
  }
  btn.addEventListener('click', () => refresh(false));
  paintAge(); setInterval(paintAge, 30000);
  setInterval(() => refresh(true), 30000);     // silent version.json poll every 30 s
})();

const parseHM = s => { if(!s) return null; const m=s.match(/^(\d{1,2}):(\d{2})$/); return m? +m[1]+ +m[2]/60 : null; };

/* Presence-based coverage: a monitored booking (tier != null) is Covered when the
   union of staff on-site blocks spans its window; Partial shows uncovered minutes. */
function coverageOf(e){
  if(e.kind!=="booking" || !e.tier) return null;
  const segs = STAFF.map(s=>[Math.max(s.start,e.start), Math.min(s.end,e.end)])
                    .filter(([a,b])=>b>a).sort((a,b)=>a[0]-b[0]);
  let covered=0, cursor=e.start, names=new Set();
  for(const [a,b] of segs){ const from=Math.max(a,cursor); if(b>from){covered+=b-from; cursor=b;} }
  STAFF.forEach(s=>{ if(Math.min(s.end,e.end)>Math.max(s.start,e.start)) names.add(s.name); });
  const total=e.end-e.start, gap=Math.round((total-covered)*60);
  const who=[...names].join(" · ");
  if(covered<=0.004) return {cls:"cov-ai", label:"AI watch", gap:Math.round(total*60), who:""};
  if(gap<=1) return {cls:"cov-ok", label:"Covered"+(who?" · "+who:""), gap:0, who};
  return {cls:"cov-part", label:`Partial · ${gap}m gap`, gap, who};
}

/* ALL times on this page are America/Toronto — the studios' clock — no matter
   what timezone the device is in (Junyan reads this from Brazil). Built from
   Intl parts rather than parsing toLocaleString(), which is engine-dependent. */
const TOR = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Toronto",
  year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false});
function torontoNow(){
  const p = Object.fromEntries(TOR.formatToParts(new Date()).map(x=>[x.type,x.value]));
  const h = (+p.hour)%24, m = +p.minute;
  return {t: h+m/60, hhmm: String(h).padStart(2,"0")+":"+String(m).padStart(2,"0"),
          date: `${p.year}-${p.month}-${p.day}`};
}
const shiftNowHour = now => {
  const base = DATA.shiftBaseDay || (DATA.generatedAtISO||"").slice(0,10);
  if(!base || !now.date) return now.t;
  const days = Math.round((Date.parse(now.date+"T00:00:00Z")-Date.parse(base+"T00:00:00Z"))/86400000);
  return days*24+now.t;
};

/* When no arrival source answered this build, `arrived` is null for EVERY
   booking — not because nobody came, but because nothing was watching. A
   no-arrival flag then accuses each finished renter of a no-show on the
   strength of no evidence (2026-08-18: Kiah Francis, while the ADT feed had
   been dead fourteen hours). Suppress the flags and let the banner say why. */
const FEED_DOWN = !!(DATA.armFeed && DATA.armFeed.down);

function stateOf(e, now){
  const arr = parseHM(e.arrived), dep = parseHM(e.departed);
  const flagged = !FEED_DOWN && e.kind==="booking" && !arr
                  && now > e.start + GRACE && now < e.end + 1;
  if(dep && dep >= e.start) return {label:"Complete", cls:"ok", flagged:false};
  if(now >= e.end) return arr ? {label:"Complete", cls:"ok", flagged:false}
                              : {label:"Ended", cls:"plain", flagged};
  if(now >= e.start) return arr ? {label:"In studio", cls:"type", flagged:false}
                                : {label:"Upcoming", cls:"plain", flagged};
  return {label:"Upcoming", cls:"plain", flagged:false};
}

const FLAG_MIN = 16/60;   // within 16 min of the window = plain green (Junyan)
const OVER_BIG = 1;       // an hour past the booked end stops being "a bit late"

/* ── Session verdict ────────────────────────────────────────────────────────
   One glyph per FINISHED booking, answering the question the desk actually
   asks when it scans the lane: did this one go normally? Reading the timeline
   row answers it too, but only one card at a time.

   THREE THINGS IT REFUSES TO DO, each for a reason that has already bitten:

   1. Judge a booking that is not over. A live booking has no departure yet, so
      a ✓ would be a guess that goes stale the moment the renter overstays.

   2. Speak while the arrival feed is down. FEED_DOWN means `arrived` is null
      for every booking because nothing was watching (see stateOf) — a ✓ or a
      ! then would be manufactured out of an outage.

   3. Certify a booking whose departure was never observed. Back-to-back
      bookings in one studio share a panel: nobody arms between them, so the
      earlier renter legitimately has `departed: null` (see the pass-2 comment
      in build.py). That is the routine case, not an alarm — so it gets NO
      badge rather than a ✓ we cannot support or a ! that accuses half the
      day's ordinary bookings.

   The three levels split on what the desk must DO:
     ✓ clean   — in and out inside the window. Nothing to do.
     ⚠ odd     — a soft overrun, an early arrival, an unexpected keypad name,
                 or an arrival we had to infer. Worth a look.
     ! serious — nobody disarmed at all, the renter was in the wrong room, or
                 the overrun is big enough to bill or to have pushed the next
                 booking. Act on it. */
function verdictOf(e, now){
  if(FEED_DOWN || e.kind!=="booking") return null;
  const nrm = t => t==null ? null : (t < e.start-12 ? t+24 : t);
  const arr = nrm(parseHM(e.arrived)), dep = nrm(parseHM(e.departed));
  const over = now >= e.end || (dep!=null && dep >= e.start);
  if(!over) return null;
  // A second calendar row for the same renter is not evidence of anything —
  // the same suppression stateOf() applies to the Missing flag.
  if(e.dup_studios) return null;
  const bad = [], odd = [];
  if(e.wrong_studio) bad.push(`In ${e.wrong_studio.studio} at ${e.wrong_studio.at}, not this studio`);
  if(arr==null){
    if(!e.wrong_studio) bad.push("No arrival — nobody disarmed this studio");
  } else {
    if(e.assumed) odd.push(e.assumed==="bypass"
      ? "Arrival inferred — the door sensor was bypassed"
      : "Arrival inferred — no disarm, the studio was already open");
    else if((e.start-arr) > FLAG_MIN) odd.push(`In ${Math.round((e.start-arr)*60)}m early`);
    if(e.arrived_foreign) odd.push(`Keyed in by ${e.arrived_by} — not the expected person`);
  }
  if(dep!=null){
    const lm = Math.round((dep-e.end)*60);
    if((dep-e.end) > OVER_BIG) bad.push(`Out ${lm}m late`);
    else if((dep-e.end) > FLAG_MIN) odd.push(`Out ${lm}m late`);
    if(e.departed_foreign) odd.push(`Armed by ${e.departed_by} — not the expected person`);
  } else if(arr!=null){
    /* Came in; nobody armed afterwards. Usually the routine back-to-back case —
       two renters share one panel, so the earlier booking has no arm of its own
       (see the pass-2 comment in build.py). Junyan's ruling, 2026-09-05: flag it
       anyway. An unclosed booking is worth a glance even when the explanation is
       boring, and the desk can tell a back-to-back from a real open studio far
       faster than this builder can. */
    odd.push("No departure seen — nobody armed after this booking");
  }
  if(bad.length) return {cls:"bad", glyph:"!", why:bad.concat(odd).join(" · ")};
  if(odd.length) return {cls:"odd", glyph:"\u26a0", why:odd.join(" · ")};
  return {cls:"ok", glyph:"\u2713", why:"In and out on time"};
}
const verdictChip = v => v
  ? `<span class="verdict ${v.cls}" title="${esc(v.why)}" aria-label="${esc(v.why)}">${v.glyph}</span>` : "";

/* One staff column: merge each person's overlapping / back-to-back shifts into a
   single block so the rail never stacks blocks on top of each other. Ela's
   18:00-18:15 + 18:15-18:45 + 18:30-19:00 becomes one 18:00-19:00 block. */
function staffBlocks(list){
  const by = new Map();
  for(const s of list) (by.get(s.name) || by.set(s.name, []).get(s.name)).push(s);
  const out = [];
  for(const [name, shifts] of by){
    shifts.sort((a,b)=>a.start-b.start);
    let cur = null;
    for(const s of shifts){
      if(cur && s.start <= cur.end + 1e-9){
        cur.end = Math.max(cur.end, s.end);
        if(s.role && !cur.roles.includes(s.role)) cur.roles.push(s.role);
      } else {
        cur = {name, start:s.start, end:s.end, roles: s.role ? [s.role] : []};
        out.push(cur);
      }
    }
  }
  return out.sort((a,b)=>a.start-b.start);
}

/* Board card geometry. Height is real duration, but floored at MIN so a
   15-minute viewing stays readable — which means a short card can reach past
   the start of the next booking. Rather than let it draw over its neighbour
   (a phantom double-booking), any run of cards whose BOXES collide is split
   into side-by-side lanes, the same trick the staff column uses. Real times
   still set every card's top edge, so the grid stays honest. */
function bookingLayout(list, SLOT, yOf){
  const MIN = 42, GAP = 3;
  const box = list.map(e => ({e, top: yOf(e.start),
                              h: Math.max((e.end - e.start) * SLOT - 6, MIN)}))
                  .sort((a, b) => a.top - b.top || b.h - a.h);
  let i = 0;
  while(i < box.length){
    // Grow the cluster while any later card starts before the cluster ends.
    let j = i + 1, end = box[i].top + box[i].h;
    while(j < box.length && box[j].top < end - 0.5){
      end = Math.max(end, box[j].top + box[j].h);
      j++;
    }
    const cluster = box.slice(i, j);
    if(cluster.length > 1){
      // Greedy: reuse the first lane whose last card has already ended.
      const laneEnd = [];
      for(const b of cluster){
        let k = laneEnd.findIndex(t => b.top >= t - 0.5);
        if(k < 0){ k = laneEnd.length; laneEnd.push(0); }
        laneEnd[k] = b.top + b.h;
        b.lane = k;
      }
      if(laneEnd.length > 1) for(const b of cluster) b.lanes = laneEnd.length;
    }
    i = j;
  }
  return box;
}

/* ── Staff identity + shift claims. Talks to server/app.py (the Hostinger
   edition). On GitHub Pages api/me answers 404, `backend` goes false, and the
   page renders exactly as before — the Notion board stays the claim path.
   Offline: the last-known identity is kept in localStorage, and a claim made
   with no network waits in an outbox until `online` fires or the page next
   loads with a connection. The server is the only judge of a claim; the outbox
   delays the question, it never answers it. ── */
const FBS_AUTH = (() => {
  const base = location.pathname.replace(/[^/]*$/, '');
  const K_ME='fbs.me', K_CL='fbs.claims', K_OUT='fbs.outbox';
  const rd=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
  const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
  const S={me:rd(K_ME,null), backend:rd(K_ME,null)?true:null, claims:rd(K_CL,[]), outbox:rd(K_OUT,[]), busy:{}, err:{}};
  const api=(p,o={})=>fetch(base+'api/'+p,{credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},...o});
  const detail=async r=>{try{return (await r.json()).detail||('Failed ('+r.status+')')}catch(e){return 'Failed ('+r.status+')'}};
  const rerender=()=>{try{render()}catch(e){}};
  async function whoami(){
    let r; try{ r=await api('me'); }catch(e){ return; }             // offline: keep what we have
    if(r.status===404){ S.backend=false; return; }                   // static edition, no server
    S.backend=true;
    if(r.status===401){ S.me=null; wr(K_ME,null);
      location.replace(base+'login?next='+encodeURIComponent(location.pathname+location.search)); return; }
    if(r.ok){ S.me=await r.json(); wr(K_ME,S.me); }
  }
  async function pull(){ if(S.backend===false) return;
    try{ const r=await api('claims'); if(r.ok){ S.claims=await r.json(); wr(K_CL,S.claims); } }catch(e){} }
  async function flush(){
    if(!S.outbox.length || S.backend===false) return;
    const keep=[];
    for(const c of S.outbox){
      try{ const r=await api('claim',{method:'POST',body:JSON.stringify({id:c.id})});
        if(r.status>=500) keep.push(c);
        else if(!r.ok && r.status!==409) S.err[c.id]=await detail(r);   // server said no: drop it, show why
      }catch(e){ keep.push(c); }
    }
    S.outbox=keep; wr(K_OUT,keep);
  }
  const claimOf=id=>S.claims.find(c=>c.id===id)||null;
  const pending=id=>S.outbox.some(c=>c.id===id);
  async function claim(id){
    if(!S.me || S.busy[id]) return;
    S.busy[id]=true; delete S.err[id]; rerender();
    let r=null;
    try{ r=await api('claim',{method:'POST',body:JSON.stringify({id})}); }catch(e){ r=null; }
    if(r===null || r.status>=500){                                    // no network / server down → outbox
      if(!pending(id)){ S.outbox.push({id,at:Date.now()}); wr(K_OUT,S.outbox); }
    } else if(r.ok || r.status===409){ await pull(); }
    else { S.err[id]=await detail(r); }
    delete S.busy[id]; header(); rerender();
  }
  async function release(id){
    if(!S.me || S.busy[id]) return;
    S.busy[id]=true; delete S.err[id]; rerender();
    try{ const r=await api('claim/'+encodeURIComponent(id),{method:'DELETE'}); if(!r.ok) S.err[id]=await detail(r); }
    catch(e){ S.err[id]='Offline — try again with signal'; }
    await pull(); delete S.busy[id]; rerender();
  }
  /* Right edge of an open-shift row. Empty on the static edition. */
  function rowExtra(o){
    if(S.backend===false || !o.id) return '';
    const c=claimOf(o.id), mine=c&&S.me&&c.name===S.me.name;
    if(c) return `<span class="chip ok">${mine?'You':esc(c.name)}</span>`
      +(mine?`<button type="button" class="claimbtn plain" data-release="${esc(o.id)}"${S.busy[o.id]?' disabled':''}>Release</button>`:'');
    if(pending(o.id)) return `<span class="chip watch">Sending…</span>`;
    if(S.err[o.id]) return `<span class="chip crit">${esc(S.err[o.id])}</span><button type="button" class="claimbtn" data-claim="${esc(o.id)}">Retry</button>`;
    return `<button type="button" class="claimbtn" data-claim="${esc(o.id)}"${S.busy[o.id]||!S.me?' disabled':''}>Claim</button>`;
  }
  function header(){
    const el=document.getElementById('who'); if(!el) return;
    if(S.backend===false||!S.me){ el.innerHTML=''; return; }
    el.innerHTML=`<a href="${base}account" title="Account">${esc(S.me.name)}</a>`
      +(S.outbox.length?`<span class="chip watch">${S.outbox.length} claim${S.outbox.length>1?'s':''} waiting for signal</span>`:'');
  }
  document.addEventListener('click',ev=>{
    const b=ev.target.closest('[data-claim],[data-release]'); if(!b) return;
    ev.preventDefault(); if(b.dataset.claim) claim(b.dataset.claim); else release(b.dataset.release);
  });
  async function sync(){ await whoami(); await flush(); await pull(); header(); rerender(); }
  function start(){ sync(); window.addEventListener('online',sync);
    setInterval(()=>{ if(S.backend!==false) sync(); },60000); }
  return {start, rowExtra, state:S};
})();

function render(){
  const now = torontoNow();
  $('#clock').textContent = now.hhmm;
  const n = now.t;

  /* header summary line (replaces the stat-card grid) */
  const bookings = E.filter(e=>e.kind==="booking");
  const inNow = E.filter(e=>e.start<=n && n<e.end && e.kind==="booking").length;
  const flags = E.filter(e=>stateOf(e,n).flagged).length;
  const monitored = bookings.filter(e=>e.tier).length;
  const seg=[];
  seg.push(`<b class="${inNow?"good":""}">${inNow}</b> in studio`);
  seg.push(`<b>${bookings.length}</b> today`);
  if(monitored) seg.push(`<b>${monitored}</b> monitored`);
  seg.push(flags ? `<b class="bad">${flags}</b> flag${flags>1?"s":""}` : `<b class="good">0</b> flags`);
  $('#summary').innerHTML = seg.join('<span class="sep">·</span>');

  /* studio strips */
  const tlHTML = (e, st) => {
    // Cross-midnight: e.start/end are decimal hours that can exceed 24, while
    // arrived/departed are wall-clock "HH:MM" — pull them into the same frame.
    const nrm = t => t==null ? null : (t < e.start-12 ? t+24 : t);
    const arr = nrm(parseHM(e.arrived)), dep = nrm(parseHM(e.departed));
    const span = e.end - e.start;
    const flaggable = e.kind==="booking";       // staff come when they come
    const early = flaggable && arr!=null && (e.start-arr) > FLAG_MIN;
    const late  = flaggable && dep!=null && (dep-e.end)  > FLAG_MIN;
    let fill = "";
    if (arr!=null){
      const b = dep!=null ? Math.min(dep,e.end) : Math.min(n,e.end);
      const l = Math.min(100, Math.max(0,(Math.max(arr,e.start)-e.start)/span*100));
      const w = Math.max(0, Math.min(100,(b-e.start)/span*100) - l);
      const liveFill = e.start<=n && n<e.end && dep==null;
      if (w>0 || liveFill)
        fill = `<div class="fill ${liveFill?"liveseg":""}" style="left:${l.toFixed(1)}%;width:${Math.max(w,2).toFixed(1)}%"></div>`;
    }
    let L, R, signal = "";
    if (arr!=null){
      const em = Math.round((e.start-arr)*60);
      /* `assumed`: the arrival was unobservable — the alarm wasn't used
         correctly — so this is an inference, not a keypad event. Amber, with
         the reason: "open" = nobody armed after the previous renter;
         "bypass" = armed with the door sensor bypassed. */
      /* Who keyed in: the panel name rides along and is shown when it is not
         the expected person (facilitator if named, else the booker) — an
         authorized user, a stand-in, staff. Matching actors stay quiet. */
      const inBy = e.arrived_foreign ? ` · ${esc(e.arrived_by)}` : "";
      if (e.assumed) {
        L = `<span class="w">${e.arrived} in</span>`;
        signal = `<span class="signal">${e.assumed==="bypass"?"door bypassed":"missing disarm"}</span>`;
      } else {
        L = early ? `<span class="w">${e.arrived} in · ${em}m early${inBy}</span>`
          : inBy ? `<span class="w" title="Keypad name is not the expected person">${e.arrived} in${inBy}</span>`
                 : `<span class="a" title="${esc(e.arrived_by||"")}">${e.arrived} in</span>`;
      }
    } else if (st.flagged && !e.dup_studios) L = `<span class="x">no arrival</span>`;
    else L = `<span>${hm(e.start)}</span>`;
    if (dep!=null){
      const lm = Math.round((dep-e.end)*60);
      const outBy = e.departed_foreign ? ` · ${esc(e.departed_by)}` : "";
      R = late ? `<span class="w">${e.departed} out · ${lm}m late${outBy}</span>`
        : outBy ? `<span class="w" title="Keypad name is not the expected person">${e.departed} out${outBy}</span>`
               : `<span class="a">${e.departed} out</span>`;
    } else R = `<span>${hm(e.end)}</span>`;
    return `<div class="tl"><div class="strip">${early?'<div class="over pre"></div>':""}` +
           `<div class="track">${fill}</div>${late?'<div class="over post"></div>':""}</div>` +
           `<div class="ends ${e.assumed?"assumed-row":""}">${L}${signal}${R}</div></div>`;
  };
  const evCard = e => {
    const st = stateOf(e,n);
    const cv = coverageOf(e);
    const live = e.start<=n && n<e.end;
    const done = !live && n>=e.end;
    const cls = ["ev", live&&!st.flagged?"live":"", st.flagged?"flagged":"",
                 done?"done":"",
                 e.kind!=="booking"?"staff":"", e.tier&&e.tier!=="Monitor"?"tier-t":""].join(" ");
    // time cell: the schedule, plus the wrong-room warning (a different job

    let act = "";
    if(e.wrong_studio) act += `<span class="act wrong">⚠ in ${e.wrong_studio.studio} at ${e.wrong_studio.at}</span>`;
    // type chip rides the NAME; the right column carries only exceptions
    let tag = "";
    /* Not a renter: a Skedda UNAVAILABLE block — cleaning, maintenance, a
       photo shoot, a hold. RED since 2026-09-03 (Junyan): front desk must not

    if(e.kind!=="booking") tag = `<span class="chip crit">Staff</span>`;

    /* `[Facilitator: Name]` on the booking: that person is who we expect at

    if(e.facilitator) tag += `<span class="chip plain" title="Booked by ${shortWho(e.who)}">for ${shortWho(e.who)}</span>`;
    let warns = "";
    /* An open Access / PIN row names this renter for today. That can mean a
       missing code, an unverified access window, or an unavailable directory

    if(e.access_gap) warns += `<span class="chip crit" title="Open access item for this renter">${esc(e.access_label||"Verify access")}</span>`;
    /* dup_studios suppresses this (a second calendar row is not evidence of a

    if(st.flagged && !e.dup_studios) warns += `<span class="chip crit">Missing</span>`;
    const dispatch = (e.dispatch||[]).length ? `<span class="dispatch-cluster">` +
      e.dispatch.map(d=>{
        /* HTA states (watchdog, 2026-09-06): STUCK = a Ready to Send row is
           past its send time; UNSENT = the only row still awaits review. */
        const value = d.state==="scheduled" ? d.time
          : d.state==="queued" ? "QUEUED"
          : d.state==="stuck" ? "STUCK"
          : d.state==="awaiting" ? "UNSENT" : "MISSING";
        const title = d.state==="scheduled" ? `Scheduled for ${d.time}`
          : d.state==="queued" ? "Queue row exists; no send time yet"
          : d.state==="stuck" ? "Queue row is Ready to Send but has not dispatched"
          : d.state==="awaiting" ? "Queue row still awaits review — nothing has been sent"
          : "Expected queue row not found";
        return `<span class="dispatch-seg ${d.state} ${d.kind.toLowerCase()}" title="${title}"><span class="dk">${d.kind}</span><span class="dv">${value}</span></span>`;
      }).join("") + `</span>` : "";
    return `<div class="${cls}" title="${esc(e.who)}">
      <div class="tm">${hm(e.start)}–${hm(e.end)}${act}</div>
      <div class="who"><span class="nm">${e.facilitator?esc(e.facilitator):shortWho(e.who)}</span><span class="tags">${tag}${gtgChip}${verdictChip(verdictOf(e,n))}</span>${tlHTML(e,st)}</div>
      <div class="warns">${warns}${dispatch}</div>
    </div>`;
  };
  /* The "N things to watch" status bar was removed 2026-07-31 (Junyan) — alarms
     live on the Alarms tab and robots on the Robots tab; the banner only
     duplicated them at the top of every page. */
  $('#staffnow').innerHTML = "";

  $('#strips').innerHTML = DATA.studios.map(s=>{
    const evs = E.filter(e=>e.studio===s.id).sort((a,b)=>a.start-b.start);
    const occupied = evs.some(e=>e.kind==="booking" && e.start<=n && n<e.end);
    return `<div class="strip">
      <div class="stu"><div class="id">${s.name}</div>
        <div class="occ ${occupied?"live":"empty"}">${occupied?"Occupied":"Empty"}</div></div>
      <div class="lane">${evs.length? evs.map(evCard).join("") : `<div class="quiet">No bookings today</div>`}</div>
    </div>`;
  }).join("");

  /* staff tab: shifts + monitored-booking coverage */
  const shiftRow = s => {
    const live = s.start<=n && n<s.end, sdone = n>=s.end;
    return `<div class="shift ${live?"live":""} ${sdone?"done":""}">
      <span class="tm">${hm(s.start)}–${hm(s.end)}</span>
      <span class="nm">${esc(s.name)}</span>
      <span class="chip ${s.role==="Open"||s.role==="Close"?"plain":"type"}">${esc(s.role)}</span>
      <span class="chip ${live?"ok":sdone?"plain":"watch"}">${live?"On now":sdone?"Done":"Upcoming"}</span>
    </div>`;
  };
  const covRow = e => {
    const cv = coverageOf(e) || {cls:"cov-ai", label:"AI watch"};
    const live = e.start<=n && n<e.end, cdone = n>=e.end;
    return `<div class="shift ${live?"live":""} ${cdone?"done":""}" title="${esc(e.who)}">
      <span class="tm">${hm(e.start)}–${hm(e.end)}</span>
      <span class="nm">${shortWho(e.who)} <span class="chip plain">${e.studio}</span></span>
      <span class="chip ${e.tier==="Monitor"?"mon":"type"}">${e.tier}</span>
      <span class="chip ${cv.cls}">${esc(cv.label)}</span>
    </div>`;
  };
  const monBk = bookings.filter(e=>e.tier).sort((a,b)=>a.start-b.start);
  /* Open (claimable) shifts. Amber row, day label because these run days
     ahead. On the claim server FBS_AUTH.rowExtra adds the Claim control; on

  const openRow = o => `<div class="shift openshift">
      <span class="tm">${hm(o.start)}–${hm(o.end)}</span>
      <span class="nm">${esc(o.day)}${o.studio?` <span class="chip plain">${esc(o.studio)}</span>`:""}</span>
      <span class="chip type">${esc(o.role)}</span>

    </div>`;
  const shiftNow = shiftNowHour(now);
  const OPENS = (DATA.openShifts || []).filter(o=>o.day_offset*24+o.end>shiftNow);

  $('#staffpanel').innerHTML =

     <a class="nbtn" href="https://app.notion.com/p/3897503281c480f2ade3c6bc1f299c60?v=3897503281c480dc8131000c1bbf52e2" target="_blank" rel="noopener" style="margin-top:12px">Claim a shift in Notion${arrow}</a>
     <p class="lane-label">Staff shifts</p>

  /* SENDING only when dispatch is due within about a minute (or overdue);

  const mstat = m => {
    if(m.status==="Error") return ["crit","Error"];
    if(m.status!=="Ready to Send") return ["watch","Review"];
    const due = m.send_after_iso ? new Date(m.send_after_iso).getTime() : 0;

  };
  const msgRow = m => {
    const [mc,ml] = mstat(m);
    const when = m.send_after ? `sends ${esc(m.send_after)}` : esc(m.created||"");

  $('#msgpanel').innerHTML =
    `<div style="margin-top:16px"><a class="nbtn" href="https://app.notion.com/p/3887503281c48136a627cfc8749e6e57?v=3887503281c481ddb3c7000cf236c3e2" target="_blank" rel="noopener">Process in Notion${arrow}</a></div>
     <p class="lane-label">Pending processing${MSGS.length?` — ${MSGS.length}`:""}</p>
     <div class="panelwrap">${MSGS.length? MSGS.map(msgRow).join("") : '<div class="shift">No messages waiting</div>'}</div>`;

  /* board */
  const lo = Math.min(9, ...E.map(e=>Math.floor(e.start)));

  board.style.gridTemplateColumns = `56px ${RAIL?RAIL+"px ":""}repeat(${DATA.studios.length}, minmax(170px,1fr))`;
  let html = `<div class="timecol"><div class="studio-h" style="height:46px"></div>` +

  if(RAIL){

        const h = Math.max((s.end-s.start)*SLOT-6, 24);

        return `<div class="staffblock ${h<34?"tight":""}" title="${esc(s.name)}${role} ${hm(s.start)}–${hm(s.end)}"
          style="top:${yOf(s.start)}px;height:${h}px">
        <div class="who">${esc(s.name)}${role}</div>
        <div class="when">${hm(s.start)}–${hm(s.end)}</div>
      </div>`;}).join("") + `</div>`;
  }
  for(const s of DATA.studios){
    html += `<div class="col">
      <div class="studio-h" style="height:46px"><h2>${s.name}</h2></div>` +
      HRS.slice(0,-1).map(()=>`<div class="slot"></div>`).join("") +
      bookingLayout(E.filter(e=>e.studio===s.id), SLOT, yOf).map(b=>{
        const e = b.e;
        const st = stateOf(e,n);
        const live = e.start<=n && n<e.end;
        const done = n>=e.end;
        // Pure schedule: live/done shading is clock-derived and stays; the
        // arrival-derived "flagged" state does NOT color this tab.
        const cls = ["booking", e.kind!=="booking"?"staff":`plan-${e.plan||"oneoff"}`,
                     e.kind==="booking"&&e.tier==="Monitor"?"monitor":"",
                     done?"done":"", live?"live":"",
                     b.lanes?"laned":"", b.h<80&&e.tier?"tight":""].join(" ");
        // Lanes divide the column's usable width (7px gutters, 3px between).
        const pos = b.lanes
          ? `left:calc(7px + ${(b.lane*100/b.lanes).toFixed(4)}% - ${(b.lane*14/b.lanes).toFixed(2)}px);`
            + `width:calc(${(100/b.lanes).toFixed(4)}% - ${(14/b.lanes + 3).toFixed(2)}px);`
          : "";
        return `<div class="${cls}" style="${pos}top:${b.top}px;height:${b.h}px" title="${esc(e.who)}">
          <div class="who">${shortWho(e.who)}</div>
          <div class="when">${hm(e.start)}–${hm(e.end)}</div>
        </div>`;
      }).join("") + `</div>`;
  }
  board.innerHTML = html;
  for(const s of STAFF){
    const band = document.createElement('div'); band.className='coverband';
    band.style.left = (56+RAIL)+"px"; band.style.top = yOf(s.start)+"px";
    band.style.height = (s.end-s.start)*SLOT+"px";
    board.appendChild(band);
  }
  if(n>=lo && n<=hi){
    const line = document.createElement('div'); line.className='nowline'; line.style.top = yOf(n)+"px";
    board.appendChild(line);
  }
}
/* ── Alarms tab ─────────────────────────────────────────────────────────────
   State is DERIVED from today's panel ledger (since 05:00): last event per studio
   — disarm ⇒ open, arm ⇒ locked. No events yet ⇒ unknown (shown as such, never
   guessed). PENDING/ALARM trigger emails get the red banner. */
function renderAlarms(){
  const evs = DATA.armEvents || [];
  const bypasses = (DATA.alarmAlerts || []).filter(a=>a.stage==="BYPASS");
  const troubles = (DATA.alarmAlerts || []).filter(a=>a.stage==="TROUBLE");
  const alerts = (DATA.alarmAlerts || []).filter(a=>!["BYPASS","TROUBLE"].includes(a.stage));
  /* No banner: the studio cards + red stream rows already carry triggers. */
  let html = "";
  if(FEED_DOWN)
    html += `<div class="statusbar warn" style="margin-top:16px"><span class="dot"></span>
      <span class="head">Arrival feed down</span><span class="items"><span class="statusitem">
      No arm/disarm events from the panel ledger or the ADT email feed — arrival times
      are unknown, not absent. No-arrival flags are suppressed.</span></span></div>`;
  /* armFallback means only "arrival times came from the board's own columns",
     which happens for TWO different reasons — a feed that broke, and a feed
     that is simply empty before the day's first disarm. Naming the email feed
     unconditionally accused it of an outage on quiet mornings when both
     sources had answered perfectly well. Say which actually happened. */
  else if(DATA.armFallback){
    const f = DATA.armFeed || {};
    const broke = ["panel","mail"].filter(k => f[k] && f[k] !== "ok" && f[k] !== "unconfigured");
    html += broke.length
      ? `<div class="statusbar warn" style="margin-top:16px"><span class="dot"></span>
        <span class="head">${broke.includes("mail")?"ADT email feed":"Panel ledger"} unavailable</span>
        <span class="items"><span class="statusitem">Showing board fallback — no event stream this edition</span></span></div>`
      : `<div class="statusbar" style="margin-top:16px"><span class="dot"></span>
        <span class="head">No panel activity yet</span><span class="items"><span class="statusitem">
        Both sources are healthy and report nothing — normal before the day&rsquo;s first disarm</span></span></div>`;
  }
  const tk=t=>{if(!t)return 99;const[h,m]=t.split(":").map(Number);const v=h+m/60;return v<5?v+24:v;};
  const ordA=(a,b)=>(tk(a.time)-tk(b.time))||((a.ts||0)-(b.ts||0));
  html += `<div class="armgrid">` + DATA.studios.map(s=>{
    const mine = evs.filter(e=>e.studio===s.id).slice().sort(ordA);
    const last = mine[mine.length-1];
    // outstanding only if nobody touched the panel at/after the alert
    const cleared = a => mine.some(e=>tk(e.time)>=tk(a.time));
    const alarmed = alerts.some(a=>a.studio===s.id && !cleared(a));
    const byp = bypasses.filter(a=>a.studio===s.id && !cleared(a));
    const trb = troubles.filter(a=>a.studio===s.id);   // trouble clears only when ADT says so
    // Nothing today? Carry the last known event forward from a prior day —
    // the panel does not reset at 05:00.
    const prior = (DATA.panelPrior||{})[s.id];
    const eff = last || prior;
    const st = !eff ? ["unknown","Unknown"]
             : eff.kind==="arrival" ? ["open","🔓 Open"] : ["locked","🔒 Armed"];
    // Open with nothing scheduled there (±30 min, staff blocks count) → warn.
    const nA = torontoNow().t;
    const openEmpty = eff && eff.kind==="arrival" && !alarmed &&
      !(DATA.events||[]).some(e=>e.studio===s.id && e.start-0.5<=nA && nA<e.end+0.5);
    // The newest outstanding fault becomes a pill on the state line. A bypass is
    // real but routine (a renter arms around a propped door), so it takes the
    // amber pill and yields to a genuine trouble condition.
    const err = trb.length ? {t:esc(trb[trb.length-1].detail||"Panel trouble"), w:false}
              : byp.length ? {t:"Bypass", w:true} : null;
    return `<div class="armcard ${(alarmed||trb.length)?"alarm":""}">
      <div class="id">${esc(s.name)}</div>
      <div class="st ${st[0]}">${st[1]}${err?`<span class="err${err.w?" warn":""}">⚠ ${err.t}</span>`:""}</div>
      ${trb.length>1?`<div class="last" style="color:var(--crit)">+${trb.length-1} more panel error${trb.length>2?"s":""}</div>`:""}
      ${trb.length&&byp.length?`<div class="last" style="color:var(--watch)">Sensor bypass also outstanding</div>`:""}
      ${openEmpty?`<div class="last" style="color:var(--crit);font-weight:700">⚠ No booking</div>`:""}
    </div>`;
  }).join("") + `</div>`;
  /* stream: arm/disarm + triggers/bypasses interleaved, newest first. Studio is
     its own chip beside the state chip so a long name never truncates it away. */
  const stream=[
    ...evs.map(e=>({...e,html:`<div class="shift">
        <span class="tm">${esc(e.time)}</span>
        ${e.name ? `<span class="nm">${esc(e.name)}</span>`
                 : `<span class="nm none" title="No actor on this event — it reached the board through the panel ledger backstop (which records the event, not the actor) or was a remote arm. Keypad events on the live event stream carry names.">no name on this source</span>`}
        <span class="chip plain">${esc(e.studio)}</span>
        <span class="chip ${e.kind==="arrival"?"ok":"plain"}">${e.kind==="arrival"?"↓ Disarmed":"↑ Armed"}</span>
      </div>`})),
    ...bypasses.concat(alerts).map(a=>{
      const done=evs.some(e=>e.studio===a.studio&&tk(e.time)>=tk(a.time));
      const label=a.stage==="BYPASS"?"Sensor bypass":a.stage==="TROUBLE"?(a.detail||"Panel trouble")
                 :a.stage==="ALARM"?"Alarm triggered":"Alarm pending";
      return {...a,html:`<div class="shift" style="${done?"opacity:.6":"background:var(--crit-bg)"}">
        <span class="tm">${esc(a.time)}</span>
        <span class="nm" style="${done?"":"color:var(--crit)"}">${label}</span>
        <span class="chip plain">${esc(a.studio)}</span>
        <span class="chip ${done?"plain":"crit"}">${done?"Cleared":"⚠ Action"}</span>
      </div>`};}),
  ].sort((a,b)=>ordA(b,a)).map(x=>x.html);
  html += `<p class="lane-label">Today's arm / disarm events</p><div class="panelwrap">` +
    (stream.length ? stream.join("") : `<div class="shift">No alarm events yet today</div>`) + `</div>`;
  /* Names come from the websocket event stream (alarm-events, live since
     2026-08-21 — canon studio-activity.md). When THAT feed did not answer a
     build, the board falls back to the nameless panel ledger, and a column of
     blanks reads as a rendering bug unless the page says why. Only shown when
     the stream was actually down — scattered nameless rows with the stream up
     are normal (panel-backstop events inside socket gaps, remote arms). */
  if(evs.some(e=>!e.name) && (DATA.armFeed||{}).doors !== "ok")
    html += `<p class="hintnote">Renter names are unavailable this build: the alarm
      event stream (<code>alarm-events</code>) did not answer, so these rows come from
      the panel ledger backstop, which records the event, not the actor. Names return
      when the stream does.</p>`;
  $('#alarmpanel').innerHTML = html;
}

/* ── Robots tab ─────────────────────────────────────────────────────────────
   Read-only projection of the 🚥 Run Monitor DB. This page is a scoreboard,
   not a watchdog — The Sentinel still does the alerting; check the header
   freshness stamp before trusting a green board. */
function agoTxt(iso){
  if(!iso) return "never";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso).getTime())/60000));
  if(m < 60) return m + "m ago";
  if(m < 48*60) return Math.round(m/60) + "h ago";
  return Math.round(m/1440) + "d ago";
}

/* One-line job descriptions — the Notion "Produces" text is prose; this is the
   glanceable version. Fallback: first 40 chars of Produces. */
const ROBOT_DESC={"Concierge":"Inbox triage + alarm tracking","Weatherman":"Sets studio thermostats",
  "Analyst":"Today's itinerary report","Bookkeeper":"Logs staff hours","Custodian":"Data housekeeping",
  "Doorman":"Morning alarm preflight","Host":"Builds today's FBS board","Planner":"Stages tomorrow's prep",
  "Responder":"Drafts held replies","Sentinel":"Pages if a run goes missing","Timekeeper":"Overtime report",
  "Treasurer":"Monthly reconciliation","Watchman":"Watches the Sentinel"};
function robotDesc(r){
  const hit=Object.keys(ROBOT_DESC).find(k=>r.run.includes(k));
  return hit?ROBOT_DESC[hit]:(r.produces||"").slice(0,40);
}
/* Predict the next fire from the human "Expected" string. Handles the roster's
   actual shapes: "~05:30" / "07:00" (daily), "09:35 + 02:35" (2×/day),
   ":20 + :50 · 08:20–22:50" (hourly minutes in a window), "hourly :30 · 07–23",
   "every 2 h at :10 · 08:10–22:10", "1st of month, 08:00". Returns
   {hhmm, mins} or null when it cannot tell. */
function nextRun(r, nowT){
  const e=(r.expected||"").split("(")[0];
  if((r.cadence||"").toLowerCase()==="monthly"){
    const m=e.match(/(\d{1,2}):(\d{2})/);
    return m?{hhmm:`1st · ${m[0]}`,mins:null}:null;
  }
  const win=e.match(/(\d{1,2})(?::(\d{2}))?\s*[–-]\s*(\d{1,2})(?::(\d{2}))?/);
  const ws=win? +win[1]+(+win[2]||0)/60 : 0, we=win? +win[3]+(+win[4]||0)/60 : 24;
  const body=win? e.replace(win[0],"") : e;
  let cands=[];
  const every=e.match(/every\s+(\d+)\s*h(?:ours?)?\s*(?:at\s*)?:(\d{2})/i);
  const hourly=e.match(/hourly(?:\s*:(\d{2}))?/i);
  const mins=[...body.matchAll(/(?:^|[^\d])(?::(\d{2}))\b/g)].map(m=>+m[1]).filter(v=>!isNaN(v));
  const daily=[...body.matchAll(/(\d{1,2}):(\d{2})/g)].map(m=>(+m[1])+(+m[2])/60);
  const addHourly=(step,minute)=>{for(let h=0;h<48;h++){const t=h+minute/60;
    const d=t%24; if(d>=ws-1e-9&&d<=we+1e-9&&(h-Math.floor(ws))%step===0)cands.push(t);}};
  if(every)addHourly(+every[1],+every[2]);
  else if(mins.length&&!daily.length)mins.forEach(mm=>addHourly(1,mm));
  else if(hourly)addHourly(1,+(hourly[1]||0));
  else if(daily.length)daily.forEach(t=>{cands.push(t);cands.push(t+24);});
  else return null;
  cands.sort((a,b)=>a-b);
  const nxt=cands.find(t=>t>nowT+1/60);
  if(nxt==null)return null;
  const d=Math.round((nxt-nowT)*60);
  const hh=String(Math.floor(nxt%24)).padStart(2,"0"), mm=String(Math.round((nxt%1)*60)%60).padStart(2,"0");
  return {hhmm:`${hh}:${mm}`,mins:d};
}
function cdTxt(nr){
  if(!nr)return"";
  if(nr.mins==null)return nr.hhmm;
  const c=nr.mins<60?`in ${nr.mins}m`:`in ${Math.floor(nr.mins/60)}h ${nr.mins%60}m`;
  return `${nr.hhmm} · ${c}`;
}
function renderRobots(){
  const R = DATA.robots;
  if(!R){
    $('#robotpanel').innerHTML = `<div class="statusbar warn" style="margin-top:16px"><span class="dot"></span>
      <span class="head">Roster unavailable</span><span class="items"><span class="statusitem">${esc(DATA.robotsNote||"Run Monitor could not be read this edition")}</span></span></div>`;
    return;
  }
  const nT = torontoNow().t;
  const live = R.filter(r=>r.monitoring==="Live");   // retired/paused personas are bookkeeping, not ops
  const overdue = live.filter(r=>r.status==="crit").length;
  const head = overdue ? `${overdue} robot${overdue>1?"s":""} overdue` : "All robots reporting";
  let html = `<div class="statusbar ${overdue?"crit":"ok"}" style="margin-top:16px"><span class="dot"></span>
    <span class="head">${head}</span><span class="items"><span class="statusitem">${live.length} watched · as of the last rebuild — The Sentinel does the paging, this is the glanceable view</span></span></div>`;
  const row = r => {
    const chip = {ok:"ok", watch:"watch", crit:"crit", plain:"plain"}[r.status] || "plain";
    const nr = nextRun(r, nT);
    return `<div class="robot">
      <span class="nm">${esc(r.run)}<small>${esc(robotDesc(r))}</small></span>
      <span style="font-family:var(--mono);font-size:12.5px;color:${r.status==="crit"?"var(--crit)":"var(--ok)"};font-weight:700;white-space:nowrap">${cdTxt(nr)||""}</span>
      <span class="chip ${chip}">${esc(r.statusLabel)}</span>
      <span class="ago">${agoTxt(r.lastISO)}</span>
    </div>`;
  };
  html += `<p class="lane-label">Watched runs</p><div class="panelwrap">` +
    (live.length ? live.map(row).join("") : `<div class="robot">Nothing watched</div>`) + `</div>`;
  $('#robotpanel').innerHTML = html;
}

/* The Issues tab was removed 2026-08-25 (Junyan: "these issues are not really
   useful") — access problems render as a red pill on the booking card in the
   Studios tab instead, and the rest lives in Notion / the Doorman's report. */
const _renderBase = render;
render = function(){ _renderBase(); renderAlarms(); renderRobots(); };
render(); setInterval(render, 30000);
FBS_AUTH.start();
</script>

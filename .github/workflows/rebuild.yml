name: Rebuild FBS Monitor

on:
  # PRIMARY trigger: the cloud RemoteTrigger driver writes a new timestamp to
  # `.rebuild-tick` (via Zapier's GitHub Create-or-Update-File) every ~15 min.
  # Scheduling on claude.ai is reliable; GitHub's own cron is not (it throttles
  # this repo's scheduled runs to ~1/hour regardless of frequency). Path-scoped
  # so the build's own index.html commit can never re-trigger the workflow.
  push:
    paths:
      - ".rebuild-tick"
  # BACKUP trigger: GitHub cron. Delivers only ~hourly here (best-effort, heavily
  # throttled on low-traffic repos), so it's a safety net behind the driver, not
  # the primary. Overnight (03:00-06:59 Toronto = 07-10 UTC in EDT, 08-11 UTC in
  # EST) it is the ONLY trigger — the day-sheet tick sleeps 02:45-08:00 Toronto —
  # and one build an hour is the ask (Junyan, 2026-09-05): the board used to
  # freeze on the prior day until the first tick landed, anywhere from 07:10 to
  # 08:00. UTC hours below cover both DST offsets; a shoulder hour is harmless.
  schedule:
    - cron: "3-59/15 11-23,0-6 * * *"
    - cron: "3 7-10 * * *"
  workflow_dispatch:          # manual "Run workflow" button
    inputs:
      debug_arm:
        description: "Log how each ADT subject parses (public logs — subjects only)"
        default: false
        type: boolean

concurrency:
  group: rebuild
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write        # google-github-actions/auth

jobs:
  rebuild:
    runs-on: ubuntu-latest
    # Mirrored here because the `secrets` context is not available to a step's
    # `if:` — the Skedda steps need to test whether the key was ever configured.
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v5

      # Skip cleanly (green, not red) until secrets are configured, so scheduled runs
      # before setup don't email a failure every 15 minutes.
      - name: Gate on setup
        id: gate
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ -z "$NOTION_TOKEN" ]; then
            echo "::notice::NOTION_TOKEN not set — setup incomplete, skipping this run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.gate.outputs.ready == 'true'
        run: pip install -r requirements.txt

      # Guards the ADT subject parsing + panel-state derivation. TELUS has changed
      # subject wording twice and each time a studio silently read the wrong state;
      # this fails the run instead. Pure string work — no network, no secrets.
      - name: ADT parsing regression tests
        if: steps.gate.outputs.ready == 'true'
        run: python test_adt_parsing.py

      # Guards booking-title cleanup and the duplicate passes. A mangled title
      # is a renter nobody recognises at the door; a mishandled duplicate is a
      # false no-show. Pure string work — no network, no secrets.
      - name: Title / dedupe regression tests
        if: steps.gate.outputs.ready == 'true'
        run: python test_titles.py

      # Guards the access-warning join and its public wording. An open
      # Access / PIN action is not proof that the Alarm Code field is empty.
      - name: Access warning regression tests
        if: steps.gate.outputs.ready == 'true'
        run: python test_issues.py

      # Guards the reduced public AVA/EOB projection. A queue outage must not
      # fabricate MISSING pills, and no recipient/body/row id may cross.
      - name: Message dispatch regression tests
        if: steps.gate.outputs.ready == 'true'
        run: python test_message_dispatch.py

      # Guards the Messages tab labels ("EOB for <renter> in Studio 527") and
      # the access-chip label. The renter name comes from today's cards only;
      # the artist id must never reach the payload.
      - name: Messages tab regression tests
        if: steps.gate.outputs.ready == 'true'
        run: python test_messages_tab.py

      # Guards open-shift placeholder parsing for the Shifts tab. Placeholders
      # must never read as a person's coverage, and nothing from an event
      # description except the studio number may reach the public page.
      - name: Open-shift regression tests
        if: steps.gate.outputs.ready == 'true'
        run: python test_open_shifts.py

      # Guards the PANEL arrival source and the feed-down guard. The email feed
      # has died twice, and each time the board rendered the outage as a red
      # "no arrival" against whoever had a finished booking. Pure logic — no
      # network, no secrets.
      - name: Arrival source / feed-down tests
        if: steps.gate.outputs.ready == 'true'
        run: python test_arm_history.py

      # Renter names for marketplace bookings. Giggster/Peerspace ICS summaries
      # name the platform, not the person, so the board reads "Giggster Booking"
      # while Skedda holds "Welton R. Giggster". The cookie lives in Secret
      # Manager, refilled daily by the skedda-refresh Cloud Run job, so nothing
      # here expires on a two-week clock.
      #
      # Optional by design: with no GCP_SA_KEY the steps are skipped, build.py
      # finds no cookie and leaves platform titles as they are. The board never
      # depends on this. `secrets` is not available to a step `if`, hence the
      # job-level env mirror.
      - name: Authenticate to GCP (Skedda cookie)
        id: gcp
        if: ${{ steps.gate.outputs.ready == 'true' && env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Read Skedda cookie
        id: cookie
        if: ${{ steps.gcp.outcome == 'success' }}
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            skedda_cookie:danceannex-skedda/skedda-cookie

      - name: Build index.html
        if: steps.gate.outputs.ready == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          # Empty when the GCP steps were skipped — build.py treats that as
          # "no enrichment", not as an error.
          SKEDDA_COOKIE: ${{ steps.cookie.outputs.skedda_cookie }}
          ICS_URL_509A: ${{ secrets.ICS_URL_509A }}
          ICS_URL_509B: ${{ secrets.ICS_URL_509B }}
          ICS_URL_527: ${{ secrets.ICS_URL_527 }}
          ICS_URL_693: ${{ secrets.ICS_URL_693 }}
          ICS_URL_901: ${{ secrets.ICS_URL_901 }}
          ICS_URL_STAFF: ${{ secrets.ICS_URL_STAFF }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # PRIMARY arrival source: alarm-mcp's /arm-history, the arm-state
          # ledger its watchdog tick writes every minute. Unset = the old
          # Gmail-only behaviour exactly, with the feed-down guard still armed.
          ALARM_HISTORY_URL: ${{ secrets.ALARM_HISTORY_URL }}
          ALARM_HISTORY_TOKEN: ${{ secrets.ALARM_HISTORY_TOKEN }}
          # Legacy: build.py had a time gate until 2026-09-05; it ignores this now.
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          DEBUG_ARM: ${{ github.event.inputs.debug_arm == 'true' && '1' || '0' }}
        run: python build.py

      # Vercel edition (server/app.py): push the built files into the app's
      # database. Skips cleanly when the secret is unset, so the Pages edition
      # never depends on it. The pages themselves are the same bytes.
      - name: Publish to the Vercel edition
        if: steps.gate.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python publish.py

      - name: Commit if changed
        if: steps.gate.outputs.ready == 'true'
        run: |
          git config user.name "fbs-monitor-bot"
          git config user.email "actions@github.com"
          # Both editions are built from the same DATA — index.html (desktop board)
          # and mobile.html (the FBS Mobile PWA). Commit BOTH: staging only
          # index.html left the mobile app frozen on whatever was last pushed.
          # The file list is explicit, so anything build.py starts writing must
          # be added here too or it is built every run and published never.
          if git diff --quiet -- index.html mobile.html panel-state.json booking-state.json version.json; then
            echo "No change — skipping commit."
          else
            STAMP="$(date -u +'%Y-%m-%d %H:%MZ')"
            MSG="FBS Monitor rebuild ${STAMP}"
            if [ -n "${FALLBACK_NOTE:-}" ]; then MSG="${MSG} — ${FALLBACK_NOTE}"; fi
            git add index.html mobile.html panel-state.json booking-state.json version.json
            git commit -m "${MSG}"
            # Another run (or a local push) may have advanced main since checkout —
            # rebase and retry so concurrent pushes don't fail the run red.
            for i in 1 2 3; do
              git push && break
              [ "$i" = 3 ] && exit 1
              # rebase -X theirs keeps the commit being replayed (our fresh index.html)
              git pull --rebase -X theirs origin main
            done
          fi
